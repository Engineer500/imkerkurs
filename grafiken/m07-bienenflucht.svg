<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 495" role="img" aria-labelledby="m07-bf-titel m07-bf-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="495" fill="#ffffff"/>
  <title id="m07-bf-titel">Die Bienenflucht im Schnitt</title>
  <desc id="m07-bf-beschr">Schnitt durch eine Zanderbeute. Unten zwei Brutzargen übereinander, darüber der Zwischenboden mit Bienenflucht, oben der Honigraum. Pfeile zeigen den Weg der Bienen nach unten, der Rückweg ist versperrt. Die Flucht liegt 24 Stunden vor der Ernte anstelle des Absperrgitters.</desc>

  <defs>
    <!-- Brutmuster auf den Waben: ein Kreis je Zelldeckel -->
    <pattern id="m07-bf-brut" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.9" fill="none" stroke="#3a2a10" stroke-width=".8" stroke-opacity=".55"/>
    </pattern>
    <!-- Pfeilspitze der Bienenwege, die Linie endet an der Basis der Spitze -->
    <marker id="m07-bf-spitze" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
    </marker>

    <!-- BIENENFORM: Arbeiterin, Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust (wie in m01) -->
    <g id="m07-bf-biene">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-11" cy="-10.9" rx="12.5" ry="5.2" transform="rotate(28 -11 -10.9)"/>
        <ellipse cx="-5.4" cy="-15.2" rx="11.5" ry="4.8" transform="rotate(62 -5.4 -15.2)"/>
      </g>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-12.5" cy="2" rx="12.5" ry="7.5" fill="#f2c14e"/>
        <path d="M-12.6 -5.5A12.5 7.5 0 0 1 -9.6 -5.3L-9.6 9.3A12.5 7.5 0 0 1 -12.6 9.5ZM-18.4 -4.61A12.5 7.5 0 0 1 -15.4 -5.3L-15.4 9.3A12.5 7.5 0 0 1 -18.4 8.61ZM-24.2 -0.64A12.5 7.5 0 0 1 -21.2 -3.39L-21.2 7.39A12.5 7.5 0 0 1 -24.2 4.64Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Innenräume: Honigraum, dann Zwischenboden und beide Brutzargen zusammenhängend -->
  <rect x="11" y="30" width="114" height="125" fill="#fff4d6"/>
  <rect x="11" y="163" width="114" height="292" fill="#fff4d6"/>

  <!-- Seitenwände im Schnitt (Vorderwand weggelassen) -->
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5">
    <rect x="6" y="30" width="5" height="425"/>
    <rect x="125" y="30" width="5" height="425"/>
  </g>
  <!-- Stoßfugen: unter dem Zwischenboden und zwischen den beiden Brutzargen -->
  <g stroke="#3a2a10" stroke-width="1.5">
    <line x1="6" y1="205" x2="11" y2="205"/>
    <line x1="125" y1="205" x2="130" y2="205"/>
    <line x1="6" y1="330" x2="11" y2="330"/>
    <line x1="125" y1="330" x2="130" y2="330"/>
  </g>

  <!-- Honigraum: Tragleisten und fünf Honigwaben im Schnitt -->
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1">
    <rect x="11" y="36" width="23" height="4"/>
    <rect x="36" y="36" width="20" height="4"/>
    <rect x="58" y="36" width="20" height="4"/>
    <rect x="80" y="36" width="20" height="4"/>
    <rect x="102" y="36" width="23" height="4"/>
  </g>
  <g fill="#f2c14e" stroke="#3a2a10" stroke-width="1.2">
    <rect x="21" y="40" width="6" height="78"/>
    <rect x="43" y="40" width="6" height="78"/>
    <rect x="65" y="40" width="6" height="78"/>
    <rect x="87" y="40" width="6" height="78"/>
    <rect x="109" y="40" width="6" height="78"/>
  </g>

  <!-- Obere Brutzarge: Tragleisten, Randwaben mit Honig, drei Waben mit Brutnest in der Mitte -->
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1">
    <rect x="11" y="236" width="23" height="4"/>
    <rect x="36" y="236" width="20" height="4"/>
    <rect x="58" y="236" width="20" height="4"/>
    <rect x="80" y="236" width="20" height="4"/>
    <rect x="102" y="236" width="23" height="4"/>
  </g>
  <g fill="#f2c14e" stroke="#3a2a10" stroke-width="1.2">
    <rect x="21" y="240" width="6" height="72"/>
    <rect x="109" y="240" width="6" height="72"/>
  </g>
  <g fill="#d9a441" stroke="#3a2a10" stroke-width="1.2">
    <rect x="43" y="240" width="6" height="72"/>
    <rect x="65" y="240" width="6" height="72"/>
    <rect x="87" y="240" width="6" height="72"/>
  </g>
  <g fill="url(#m07-bf-brut)">
    <rect x="43" y="240" width="6" height="72"/>
    <rect x="65" y="240" width="6" height="72"/>
    <rect x="87" y="240" width="6" height="72"/>
  </g>

  <!-- Untere Brutzarge: gleiche Bauweise wie die obere -->
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1">
    <rect x="11" y="361" width="23" height="4"/>
    <rect x="36" y="361" width="20" height="4"/>
    <rect x="58" y="361" width="20" height="4"/>
    <rect x="80" y="361" width="20" height="4"/>
    <rect x="102" y="361" width="23" height="4"/>
  </g>
  <g fill="#f2c14e" stroke="#3a2a10" stroke-width="1.2">
    <rect x="21" y="365" width="6" height="72"/>
    <rect x="109" y="365" width="6" height="72"/>
  </g>
  <g fill="#d9a441" stroke="#3a2a10" stroke-width="1.2">
    <rect x="43" y="365" width="6" height="72"/>
    <rect x="65" y="365" width="6" height="72"/>
    <rect x="87" y="365" width="6" height="72"/>
  </g>
  <g fill="url(#m07-bf-brut)">
    <rect x="43" y="365" width="6" height="72"/>
    <rect x="65" y="365" width="6" height="72"/>
    <rect x="87" y="365" width="6" height="72"/>
  </g>

  <!-- Boden -->
  <rect x="6" y="455" width="124" height="10" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Zwischenboden: dünne Platte mit mittiger Öffnung -->
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5">
    <rect x="6" y="155" width="44" height="8"/>
    <rect x="86" y="155" width="44" height="8"/>
  </g>
  <!-- Fluchteinsatz als nach unten verjüngter Trichter, im Schnitt zwei Wände -->
  <g fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round">
    <path d="M50 155H54L62 199H59Z"/>
    <path d="M86 155H82L74 199H77Z"/>
  </g>

  <!-- Bienen im Honigraum: zwei am Boden auf dem Weg zur Öffnung, eine zwischen den Waben -->
  <use href="#m07-bf-biene" transform="translate(30 138) rotate(35) scale(.55)"/>
  <use href="#m07-bf-biene" transform="translate(106 138) rotate(-35) scale(-.55 .55)"/>
  <use href="#m07-bf-biene" transform="translate(55.5 80) rotate(90) scale(.4)"/>
  <!-- Bienen in den Brutzargen zwischen den Waben -->
  <use href="#m07-bf-biene" transform="translate(55.5 276) rotate(90) scale(.4)"/>
  <use href="#m07-bf-biene" transform="translate(77.5 401) rotate(90) scale(.4)"/>

  <!-- Gebogene Wege der Bienen nach unten durch den Trichter in den Brutraum -->
  <g fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M45 147C55 150 64 154 65 166L65 190C65 200 60 208 53 215" marker-end="url(#m07-bf-spitze)"/>
    <path d="M91 147C81 150 72 154 71 166L71 190C71 200 76 208 83 215" marker-end="url(#m07-bf-spitze)"/>
  </g>

  <!-- Rückweg versperrt: Pfeil nach oben, durchgekreuzt -->
  <line x1="106" y1="233" x2="106" y2="220" stroke="#3a2a10" stroke-width="2.5"/>
  <path d="M106 210L100.5 221H111.5Z" fill="#3a2a10" stroke="#3a2a10" stroke-width="1" stroke-linejoin="round"/>
  <path d="M99.5 218.5L112.5 231.5M112.5 218.5L99.5 231.5" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Klammer rechts neben dem Zwischenboden -->
  <path d="M134 145Q140 145 140 151V155Q140 159 146 159Q140 159 140 163V167Q140 173 134 173" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Klammer rechts neben den beiden Brutzargen -->
  <path d="M134 240Q140 240 140 246V325Q140 331 146 331Q140 331 140 337V449Q140 455 134 455" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Linien zu den Beschriftungen -->
  <g stroke="#3a2a10" stroke-width="1">
    <line x1="127.5" y1="80" x2="132" y2="80"/>
    <line x1="79.3" y1="188" x2="132" y2="188"/>
    <line x1="75.7" y1="207" x2="132" y2="207"/>
    <line x1="113" y1="225" x2="132" y2="225"/>
  </g>
  <g fill="#3a2a10">
    <circle cx="127.5" cy="80" r="2.3"/>
    <circle cx="79.3" cy="188" r="2.3"/>
    <circle cx="75.7" cy="207" r="2.3"/>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="136" y="85.5">Honigraum</text>
    <text x="152" y="154">24 Stunden vorher einlegen</text>
    <text x="152" y="174">anstelle des Absperrgitters</text>
    <text x="136" y="193.5">Bienenflucht im Zwischenboden</text>
    <text x="136" y="212.5">Bienen laufen nach unten</text>
    <text x="136" y="230.5">kein Weg zurück</text>
    <text x="152" y="336.5">Brutraum, zwei Zargen</text>
  </g>
</svg>
