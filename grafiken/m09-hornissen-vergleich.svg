<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-labelledby="m09-hv-titel m09-hv-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="380" fill="#ffffff"/>
  <title id="m09-hv-titel">Asiatische und Europäische Hornisse im Vergleich</title>
  <desc id="m09-hv-beschr">Zwei Hornissen schematisch nebeneinander. Links die Asiatische Hornisse mit orangefarbenem Gesicht, schwarzem Kopf oben, schwarzem Hinterleib mit gelber Binde und gelben Beinen. Rechts die geschützte Europäische Hornisse mit gelbem Gesicht, rotbraunem Kopf oben, überwiegend gelbem Hinterleib und rotbraunen Beinen.</desc>

  <defs>
    <!-- Muster: Punkte (orange Gesicht), Querstreifen (gelbes Gesicht), Schrägschraffur (rotbrauner Kopf) -->
    <pattern id="m09-hv-punkte" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#e07b39"/>
      <circle cx="2.5" cy="2.5" r="1.1" fill="#1f1a12" fill-opacity=".75"/>
    </pattern>
    <pattern id="m09-hv-quer" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="4" fill="#f2c14e"/>
      <line x1="0" y1="2" x2="6" y2="2" stroke="#3a2a10" stroke-width=".9" stroke-opacity=".55"/>
    </pattern>
    <pattern id="m09-hv-schraeg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#8c3a16"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#f2c14e" stroke-width="1.3" stroke-opacity=".8"/>
    </pattern>

    <!-- Gemeinsame Form der Hornisse, Seitenansicht, Blick nach links, Ursprung in der Mitte der Brust -->
    <clipPath id="m09-hv-kopfform"><ellipse cx="-64" cy="0" rx="24" ry="21"/></clipPath>
    <clipPath id="m09-hv-hinterleibsform"><path d="M-4 2C-2 -12 18 -18 38 -14C58 -10 76 -1 84 8C74 16 52 21 34 19C14 17 -4 14 -4 2Z"/></clipPath>
    <path id="m09-hv-hinterleib" d="M-4 2C-2 -12 18 -18 38 -14C58 -10 76 -1 84 8C74 16 52 21 34 19C14 17 -4 14 -4 2Z"/>
    <path id="m09-hv-gesicht" d="M-95 -16L-46 12V30H-95Z"/>
    <!-- Flügel, am Ansatz über der Brust drehbar -->
    <g id="m09-hv-fluegel" fill="#ffffff" fill-opacity=".62" stroke="#3a2a10" stroke-width="1.1">
      <ellipse cx="35" cy="0" rx="36" ry="8" transform="translate(-28 -14) rotate(-14)"/>
      <ellipse cx="32" cy="0" rx="32" ry="7.5" transform="translate(-28 -14) rotate(-30)"/>
    </g>
    <!-- drei Beine als Linienzug -->
    <path id="m09-hv-beine" d="M-38 14L-48 30L-45 46M-26 16L-28 34L-24 50M-14 15L-6 30L0 46" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="m09-hv-fuehler" d="M-76 -16Q-88 -26 -98 -26M-70 -19Q-76 -32 -86 -38" fill="none" stroke="#3a2a10" stroke-width="1.8" stroke-linecap="round"/>
  </defs>

  <!-- feine Trennlinie in der Mitte -->
  <line x1="200" y1="10" x2="200" y2="370" stroke="#3a2a10" stroke-width="1" stroke-opacity=".4"/>

  <!-- ===== Links: Asiatische Hornisse ===== -->
  <g transform="translate(104 168) scale(.92)">
    <use href="#m09-hv-fluegel"/>
    <!-- Beine gelb -->
    <use href="#m09-hv-beine" stroke="#3a2a10" stroke-width="5.4"/>
    <use href="#m09-hv-beine" stroke="#f2c14e" stroke-width="3.2"/>
    <!-- Hinterleib: schwarz mit gelber Binde und orangefarbenem Ende -->
    <use href="#m09-hv-hinterleib" fill="#1f1a12"/>
    <g clip-path="url(#m09-hv-hinterleibsform)">
      <rect x="26" y="-22" width="16" height="48" fill="#f2c14e"/>
      <rect x="62" y="-22" width="30" height="48" fill="#e07b39"/>
    </g>
    <use href="#m09-hv-hinterleib" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="-3" cy="2" rx="4" ry="3.6" fill="#1f1a12"/>
    <!-- Brust schwarz -->
    <ellipse cx="-26" cy="-1" rx="21" ry="17" fill="#1f1a12" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.1"/>
    <!-- Kopf: oben schwarz, Gesicht orange mit Punktmuster -->
    <use href="#m09-hv-fuehler"/>
    <ellipse cx="-64" cy="0" rx="24" ry="21" fill="#1f1a12"/>
    <g clip-path="url(#m09-hv-kopfform)">
      <use href="#m09-hv-gesicht" fill="url(#m09-hv-punkte)"/>
      <path d="M-95 -16L-46 12" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
    </g>
    <ellipse cx="-64" cy="0" rx="24" ry="21" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
    <ellipse cx="-62" cy="-8" rx="6.5" ry="8" fill="#1f1a12" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="-64" cy="-11.5" r="2" fill="#ffffff"/>
    <path d="M-86 4L-79 10L-88 17Z" fill="#3a2a10"/>
  </g>

  <!-- ===== Rechts: Europäische Hornisse ===== -->
  <g transform="translate(300 168) scale(.92)">
    <use href="#m09-hv-fluegel"/>
    <!-- Beine rotbraun -->
    <use href="#m09-hv-beine" stroke="#3a2a10" stroke-width="5.4"/>
    <use href="#m09-hv-beine" stroke="#8c3a16" stroke-width="3.2"/>
    <!-- Hinterleib: überwiegend gelb mit schmalen schwarzen Streifen -->
    <use href="#m09-hv-hinterleib" fill="#f2c14e"/>
    <g clip-path="url(#m09-hv-hinterleibsform)" fill="#1f1a12">
      <rect x="4" y="-22" width="4" height="48"/>
      <rect x="17" y="-22" width="4" height="48"/>
      <rect x="31" y="-22" width="4" height="48"/>
      <rect x="45" y="-22" width="4" height="48"/>
      <rect x="59" y="-22" width="4" height="48"/>
      <rect x="72" y="-22" width="4" height="48"/>
    </g>
    <use href="#m09-hv-hinterleib" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="-3" cy="2" rx="4" ry="3.6" fill="#5a2a12" stroke="#3a2a10" stroke-width="1.3"/>
    <!-- Brust dunkelbraun -->
    <ellipse cx="-26" cy="-1" rx="21" ry="17" fill="#5a2a12" stroke="#3a2a10" stroke-width="1.5"/>
    <!-- Kopf: oben rotbraun mit Schrägschraffur, Gesicht gelb mit Querstreifen -->
    <use href="#m09-hv-fuehler"/>
    <ellipse cx="-64" cy="0" rx="24" ry="21" fill="url(#m09-hv-schraeg)"/>
    <g clip-path="url(#m09-hv-kopfform)">
      <use href="#m09-hv-gesicht" fill="url(#m09-hv-quer)"/>
      <path d="M-95 -16L-46 12" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
    </g>
    <ellipse cx="-64" cy="0" rx="24" ry="21" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
    <ellipse cx="-62" cy="-8" rx="6.5" ry="8" fill="#1f1a12" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="-64" cy="-11.5" r="2" fill="#ffffff"/>
    <path d="M-86 4L-79 10L-88 17Z" fill="#3a2a10"/>
  </g>

  <!-- Schutzsymbol neben der Überschrift rechts: Schild mit Haken -->
  <path d="M376 6L386 9V18C386 25 380 29 376 31C372 29 366 25 366 18V9Z" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M371 18L375 23L382 13" fill="none" stroke="#5b8c3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Linien zu den Beschriftungen -->
  <g stroke="#ffffff" stroke-width="4" fill="none">
    <line x1="56" y1="99" x2="56" y2="152"/>
    <line x1="34" y1="279" x2="34" y2="177"/>
    <line x1="61" y1="228" x2="61" y2="203"/>
    <line x1="159" y1="324" x2="159" y2="182"/>
    <line x1="252" y1="99" x2="252" y2="152"/>
    <line x1="230" y1="279" x2="230" y2="177"/>
    <line x1="257" y1="228" x2="257" y2="203"/>
    <line x1="355" y1="324" x2="355" y2="182"/>
  </g>
  <g stroke="#3a2a10" stroke-width="1" fill="none">
    <line x1="56" y1="99" x2="56" y2="152"/>
    <line x1="34" y1="279" x2="34" y2="177"/>
    <line x1="61" y1="228" x2="61" y2="203"/>
    <line x1="159" y1="324" x2="159" y2="182"/>
    <line x1="252" y1="99" x2="252" y2="152"/>
    <line x1="230" y1="279" x2="230" y2="177"/>
    <line x1="257" y1="228" x2="257" y2="203"/>
    <line x1="355" y1="324" x2="355" y2="182"/>
  </g>
  <g fill="#3a2a10" stroke="#ffffff" stroke-width="1">
    <circle cx="56" cy="152" r="2.6"/>
    <circle cx="34" cy="177" r="2.6"/>
    <circle cx="61" cy="203" r="2.6"/>
    <circle cx="159" cy="182" r="2.6"/>
    <circle cx="252" cy="152" r="2.6"/>
    <circle cx="230" cy="177" r="2.6"/>
    <circle cx="257" cy="203" r="2.6"/>
    <circle cx="355" cy="182" r="2.6"/>
  </g>

  <!-- Überschriften -->
  <g fill="#1f1a12" font-size="16" font-weight="700" text-anchor="middle">
    <text x="104" y="26">Asiatische</text>
    <text x="104" y="46">Hornisse</text>
    <text x="298" y="26">Europäische</text>
    <text x="298" y="46">Hornisse, geschützt</text>
  </g>

  <!-- Merkmale links -->
  <g fill="#1f1a12" font-size="16">
    <text x="14" y="94">Kopf oben schwarz</text>
    <text x="63" y="244">Beine</text>
    <text x="63" y="262">gelb</text>
    <text x="30" y="292">Gesicht orange</text>
    <text x="192" y="340" text-anchor="end">Hinterleib schwarz</text>
    <text x="192" y="358" text-anchor="end">mit gelber Binde</text>
  </g>
  <!-- Merkmale rechts -->
  <g fill="#1f1a12" font-size="16">
    <text x="210" y="94">Kopf oben rotbraun</text>
    <text x="259" y="244">Beine</text>
    <text x="259" y="262">rotbraun</text>
    <text x="226" y="292">Gesicht gelb</text>
    <text x="388" y="340" text-anchor="end">Hinterleib</text>
    <text x="388" y="358" text-anchor="end">überwiegend gelb</text>
  </g>
</svg>
