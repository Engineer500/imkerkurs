<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="m05-fc-titel m05-fc-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="260" fill="#ffffff"/>
  <title id="m05-fc-titel">Futterkontrolle von außen: Beuten hinten anheben</title>
  <desc id="m05-fc-beschr">Zwei Beuten von der Seite. Volk 1 steht ruhig und ist schwerer. Bei Volk 2 wird das hintere Ende angehoben, es ist leichter und wird zuerst geprüft.</desc>

  <defs>
    <!-- Beute von der Seite, Flugloch links. Ursprung: vordere untere Ecke der Zarge.
         Boden, zwei Zargen mit Griffmulde, Blechdeckel. -->
    <g id="m05-fc-beute">
      <rect x="-3" y="-9" width="102" height="9" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
      <rect x="-3" y="-6.5" width="16" height="3.5" fill="#3a2a10"/>
      <rect x="0" y="-49" width="96" height="40" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
      <rect x="0" y="-89" width="96" height="40" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
      <rect x="36" y="-33" width="24" height="6" rx="3" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
      <rect x="36" y="-73" width="24" height="6" rx="3" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
      <path d="M-3 -89L1 -100Q2 -101 3 -101H93Q94 -101 95 -100L99 -89Z" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="10" y1="-95" x2="86" y2="-95" stroke="#ffffff" stroke-width="2" stroke-opacity=".7" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Boden -->
  <line x1="8" y1="190" x2="392" y2="190" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Flache Ständer -->
  <rect x="10" y="180" width="72" height="10" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="170" y="180" width="72" height="10" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Volk 1: gerade und ruhig -->
  <use href="#m05-fc-beute" transform="translate(16 180)"/>

  <!-- Volk 2: hinten um etwa 6 Grad angehoben, gekippt um die vordere untere Ecke -->
  <use href="#m05-fc-beute" transform="translate(176 180) rotate(-6)"/>

  <!-- Hand unter dem hinteren Ende: Finger unter dem Boden, Daumen an der Rückwand -->
  <path d="M255 174H277V156Q277 144 283 144Q289 144 289 156L293 170Q296 172 302 172L322 170H400V190H322Q304 190 297 187H255Q249 187 249 180.5Q249 174 255 174Z" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M262 175V186M270 175V186M330 170V190" fill="none" stroke="#3a2a10" stroke-width="1"/>

  <!-- Pfeil nach oben am hinteren Ende -->
  <line x1="310" y1="164" x2="310" y2="132" stroke="#b45309" stroke-width="3.5"/>
  <path d="M310 116L300 134H320Z" fill="#b45309" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Gewichtszeichen unter Volk 1: groß und dick, dazu ein breiter Pfeil nach unten -->
  <line x1="28" y1="198" x2="28" y2="222" stroke="#b45309" stroke-width="6"/>
  <path d="M28 234L19 220H37Z" fill="#b45309" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M56 210Q56 201 64 201Q72 201 72 210" fill="none" stroke="#3a2a10" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 231L53 210H75L82 231Z" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Gewichtszeichen unter Volk 2: klein und dünn -->
  <line x1="196" y1="198" x2="196" y2="212" stroke="#b45309" stroke-width="2.5"/>
  <path d="M196 221L191 211H201Z" fill="#b45309" stroke="#b45309" stroke-width="1" stroke-linejoin="round"/>
  <path d="M218 213Q218 207 222 207Q226 207 226 213" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M212 227L216 213H228L232 227Z" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Markierung: dieses Volk zuerst prüfen -->
  <circle cx="164" cy="22" r="11" fill="#b45309"/>
  <text x="164" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">!</text>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="64" y="56" text-anchor="middle" font-size="17" font-weight="700">Volk 1</text>
    <text x="222" y="56" text-anchor="middle" font-size="17" font-weight="700">Volk 2</text>
    <text x="181" y="28">zuerst prüfen</text>
    <text x="326" y="128"><tspan x="326">hinten </tspan><tspan x="326" dy="20">anheben</tspan></text>
    <text x="64" y="252" text-anchor="middle">schwerer</text>
    <text x="222" y="252" text-anchor="middle">leichter</text>
  </g>
</svg>
