<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-labelledby="m08-mk-titel m08-mk-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="380" fill="#ffffff"/>
  <title id="m08-mk-titel">Bienen und Milben von April bis Oktober</title>
  <desc id="m08-mk-beschr">Zwei Kurven über die Monate April bis Oktober, oben die Bienen im Volk, unten die Milben. Die Bienenzahl steigt bis zur Sonnenwende und sinkt danach. Die Milbenzahl wächst zuerst langsam und dann immer steiler. Ein Band markiert August und September, in denen die Winterbienen erbrütet werden.</desc>

  <defs>
    <!-- Streifenmuster des Bandes: schräge Linien, damit die Information nicht an der Farbe hängt -->
    <pattern id="m08-mk-streifen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b45309" stroke-width="2" stroke-opacity=".5"/>
    </pattern>

    <!-- BIENENFORM: Arbeiterin, Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust (wie in m01) -->
    <g id="m08-mk-biene">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-11" cy="-10.9" rx="12.5" ry="5.2" transform="rotate(28 -11 -10.9)"/>
        <ellipse cx="-5.4" cy="-15.2" rx="11.5" ry="4.8" transform="rotate(62 -5.4 -15.2)"/>
      </g>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-12.5" cy="2" rx="12.5" ry="7.5" fill="#f2c14e"/>
        <path d="M-12.6 -5.5A12.5 7.5 0 0 1 -9.6 -5.3L-9.6 9.3A12.5 7.5 0 0 1 -12.6 9.5ZM-18.4 -4.61A12.5 7.5 0 0 1 -15.4 -5.3L-15.4 9.3A12.5 7.5 0 0 1 -18.4 8.61ZM-24.2 -0.64A12.5 7.5 0 0 1 -21.2 -3.39L-21.2 7.39A12.5 7.5 0 0 1 -24.2 4.64Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
    </g>

    <!-- MILBE: Varroamilbe von oben, breit-ovaler rotbrauner Körper mit vier Beinpaaren -->
    <g id="m08-mk-milbe">
      <path d="M-3.5 -3L-7.5 -6.5M-1.5 -3.8L-3.5 -8M1.5 -3.8L3.5 -8M3.5 -3L7.5 -6.5M-3.5 3L-7.5 6.5M-1.5 3.8L-3.5 8M1.5 3.8L3.5 8M3.5 3L7.5 6.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse rx="6.5" ry="5" fill="#b8322a" stroke="#3a2a10" stroke-width="1.2"/>
      <ellipse cx="-1.5" cy="-1.5" rx="2.6" ry="1.5" fill="#ffffff" fill-opacity=".35"/>
    </g>
  </defs>

  <!-- Band August und September über beide Diagramme (1. August bis 30. September) -->
  <rect x="260" y="52" width="100" height="264" fill="#f2c14e" fill-opacity=".3"/>
  <rect x="260" y="52" width="100" height="264" fill="url(#m08-mk-streifen)" stroke="#b45309" stroke-width="1.5"/>

  <!-- Achsen: oben Bienen, unten Milben, y-Achse nur mit Pfeil, ohne Zahlen -->
  <g fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round">
    <path d="M60 166H380M60 166V62"/>
    <path d="M60 316H380M60 316V212"/>
  </g>
  <path d="M60 52L55 64H65ZM60 202L55 214H65Z" fill="#3a2a10"/>

  <!-- Marken der Zeitachse (1. April, 1. Juni, 1. August, 1. Oktober) -->
  <g stroke="#3a2a10" stroke-width="1" fill="none">
    <path d="M60 166v5M160 166v5M260 166v5M360 166v5"/>
  </g>
  <g stroke="#3a2a10" stroke-width="1.5" fill="none">
    <path d="M60 316v7M160 316v7M260 316v7M360 316v7"/>
  </g>

  <!-- Sonnenwende, Ende Juni: senkrechte gestrichelte Linie durch beide Diagramme -->
  <line x1="195" y1="52" x2="195" y2="316" stroke="#3a2a10" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Kurve der Bienenzahl: honigfarben mit dunkler Kontur, Maximum zur Sonnenwende -->
  <path d="M60 157C95 154 135 80 195 72C240 66 300 108 380 148" fill="none" stroke="#3a2a10" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M60 157C95 154 135 80 195 72C240 66 300 108 380 148" fill="none" stroke="#f2c14e" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="195" cy="72" r="4.5" fill="#f2c14e" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Kurve der Milbenzahl: flach bis Juni, danach immer steiler, im Oktober leicht abflachend -->
  <path d="M60 310C110 310 150 309 180 305C215 300 245 289 270 272C295 254 315 233 335 220C350 212 365 209 380 208" fill="none" stroke="#b8322a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Symbole zu den Kurvennamen -->
  <use href="#m08-mk-biene" transform="translate(148 72) scale(.55)"/>
  <use href="#m08-mk-milbe" transform="translate(152 227)"/>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="72" y="78" font-weight="700">Bienen</text>
    <text x="72" y="233" font-weight="700">Milben</text>
    <text x="189" y="191" text-anchor="end">Sonnenwende</text>
    <g text-anchor="middle">
      <text x="60" y="342">Apr</text>
      <text x="160" y="342">Jun</text>
      <text x="260" y="342">Aug</text>
      <text x="360" y="342">Okt</text>
      <text x="310" y="22">Winterbienen werden</text>
      <text x="310" y="42">erbrütet</text>
    </g>
  </g>
  <text x="200" y="368" text-anchor="middle" font-size="14" fill="#1f1a12">Schema, keine Messwerte</text>
</svg>
