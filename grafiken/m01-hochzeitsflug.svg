<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 267" role="img" aria-labelledby="m01-hz-titel m01-hz-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="267" fill="#ffffff"/>
  <title id="m01-hz-titel">Der Hochzeitsflug der Jungkönigin</title>
  <desc id="m01-hz-beschr">Seitenansicht: Von der Beute am Boden fliegt die Königin bis zu 3 km weit zu einem Drohnensammelplatz in 5 bis 40 m Höhe, an dem viele Drohnen fliegen. Die Zeichnung ist nicht maßstäblich.</desc>

  <defs>
    <!-- BIENENFORM: Königin. Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust.
         Länger und schlanker als die Arbeiterin (etwa 50 statt 40 Einheiten), Flügel kürzer als der Hinterleib. -->
    <g id="biene-koenigin">
      <!-- Flügel: halbtransparent, hinter dem Körper -->
      <g id="biene-koenigin-fluegel" fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-9.3" cy="-9.9" rx="10.5" ry="4.6" transform="rotate(28 -9.3 -9.9)"/>
        <ellipse cx="-5.5" cy="-12.8" rx="9.5" ry="4.2" transform="rotate(55 -5.5 -12.8)"/>
      </g>
      <!-- Beine -->
      <path id="biene-koenigin-beine" d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Rumpf: langer Hinterleib mit drei dunklen Streifen, davor die Brust -->
      <g id="biene-koenigin-rumpf" stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-17.5" cy="2" rx="17.5" ry="7.2" fill="#f2c14e"/>
        <path d="M-15 -5.13A17.5 7.2 0 0 1 -12 -4.84L-12 8.84A17.5 7.2 0 0 1 -15 9.13ZM-21.5 -5.01A17.5 7.2 0 0 1 -18.5 -5.19L-18.5 9.19A17.5 7.2 0 0 1 -21.5 9.01ZM-28 -3.76A17.5 7.2 0 0 1 -25 -4.51L-25 8.51A17.5 7.2 0 0 1 -28 7.76Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <!-- Kopf mit Auge und Fühlern -->
      <g id="biene-koenigin-kopf">
        <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
        <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
        <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
      </g>
    </g>
  </defs>

  <!-- Sammelplatz: Zone zwischen 5 m und 40 m über dem Boden -->
  <rect x="206" y="38" width="128" height="128" fill="#4a7fb5" fill-opacity=".1"/>
  <g stroke="#3a2a10" stroke-width="1" stroke-dasharray="6 4">
    <line x1="200" y1="38" x2="340" y2="38"/>
    <line x1="200" y1="166" x2="340" y2="166"/>
  </g>
  <!-- gepunktete Senkrechte bis zum Boden: die Höhen sind über dem Boden gemeint -->
  <line x1="334" y1="38" x2="334" y2="184" stroke="#3a2a10" stroke-width="1" stroke-dasharray="1 3.5" stroke-linecap="round"/>

  <!-- Drohnen am Sammelplatz -->
  <g fill="#3a2a10">
    <circle cx="222" cy="91" r="3.3"/>
    <circle cx="223" cy="115" r="3.3"/>
    <circle cx="239" cy="103" r="3.3"/>
    <circle cx="240" cy="125" r="3.3"/>
    <circle cx="241" cy="62" r="3.3"/>
    <circle cx="244" cy="81" r="3.3"/>
    <circle cx="257" cy="150" r="3.3"/>
    <circle cx="259" cy="69" r="3.3"/>
    <circle cx="264" cy="131" r="3.3"/>
    <circle cx="267" cy="108" r="3.3"/>
    <circle cx="271" cy="84" r="3.3"/>
    <circle cx="275" cy="58" r="3.3"/>
    <circle cx="285" cy="143" r="3.3"/>
    <circle cx="287" cy="124" r="3.3"/>
    <circle cx="289" cy="98" r="3.3"/>
    <circle cx="299" cy="60" r="3.3"/>
    <circle cx="301" cy="79" r="3.3"/>
    <circle cx="306" cy="142" r="3.3"/>
    <circle cx="307" cy="123" r="3.3"/>
    <circle cx="322" cy="97" r="3.3"/>
  </g>

  <!-- Boden mit Gras -->
  <rect x="0" y="184" width="400" height="8" fill="#5b8c3a" fill-opacity=".4"/>
  <g fill="none" stroke="#5b8c3a" stroke-width="1.6" stroke-linecap="round">
    <path d="M100 184L97.5 177M100 184V175M100 184L102.5 177"/>
    <path d="M126 184L123.5 178M126 184V176M126 184L128.5 178"/>
    <path d="M158 184L155.5 177M158 184V175M158 184L160.5 177"/>
    <path d="M190 184L187.5 178M190 184V176M190 184L192.5 178"/>
    <path d="M222 184L219.5 177M222 184V175M222 184L224.5 177"/>
    <path d="M252 184L249.5 178M252 184V176M252 184L254.5 178"/>
    <path d="M284 184L281.5 177M284 184V175M284 184L286.5 177"/>
    <path d="M312 184L309.5 178M312 184V176M312 184L314.5 178"/>
    <path d="M362 184L359.5 177M362 184V175M362 184L364.5 177"/>
    <path d="M388 184L385.5 178M388 184V176M388 184L390.5 178"/>
    <path d="M10 184L7.5 177M10 184V175M10 184L12.5 177"/>
  </g>
  <line x1="0" y1="184" x2="400" y2="184" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Beute mit Flugloch und Flugbrett -->
  <rect x="22" y="150" width="56" height="34" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="17" y="141" width="66" height="9" fill="#d9a441" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="67" y="173" width="11" height="8" fill="#3a2a10"/>
  <rect x="78" y="180" width="14" height="4" fill="#d9a441" stroke="#3a2a10" stroke-width="1.2"/>

  <!-- Flugbahn der Königin: gestrichelter Bogen mit Pfeilspitze -->
  <path d="M92 177C104 112 140 92 206 95" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 5" stroke-linecap="round"/>
  <path d="M216 95.5L205.8 100L206.2 90Z" fill="#b45309"/>

  <!-- Königin in der Mitte der Bahn -->
  <use href="#biene-koenigin" transform="translate(128.8 110.5) rotate(-34) scale(1.3)"/>

  <!-- Maßpfeil: Strecke von der Beute bis unter den Sammelplatz -->
  <g stroke="#3a2a10" stroke-width="1">
    <line x1="50" y1="194" x2="50" y2="222"/>
    <line x1="334" y1="194" x2="334" y2="222"/>
  </g>
  <line x1="54" y1="212" x2="330" y2="212" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M50 212L60 207L60 217ZM334 212L324 207L324 217Z" fill="#3a2a10"/>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="50" y="132" text-anchor="middle" font-size="16">Beute</text>
    <text x="127" y="76" text-anchor="middle" font-size="16">Königin</text>
    <text x="270" y="24" text-anchor="middle" font-size="16" font-weight="700">Drohnensammelplatz</text>
    <text x="347" y="43.5" font-size="16">40 m</text>
    <text x="347" y="171.5" font-size="16">5 m</text>
    <text x="192" y="238" text-anchor="middle" font-size="16" font-weight="700">bis zu 3 km</text>
    <text x="392" y="259" text-anchor="end" font-size="14" font-style="italic">nicht maßstäblich</text>
  </g>
</svg>
