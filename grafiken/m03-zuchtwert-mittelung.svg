<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="m03-zm-titel m03-zm-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="280" fill="#ffffff"/>
  <title id="m03-zm-titel">Der Zuchtwert der Nachkommen als Mittelwert</title>
  <desc id="m03-zm-beschr">Skala von 90 bis 130 mit dem Mittel 100: Die Königin liegt bei 120, die Drohnen der Umgebung bei 100, ihre Nachkommen als Mittelwert beider bei 110.</desc>

  <defs>
    <!-- Pfeilspitze, die Linie endet an der Basis der Spitze -->
    <marker id="zm-spitze" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3a2a10"/>
    </marker>
  </defs>

  <!-- Skala 90 bis 130: 1 Wert = 9 Einheiten, 90 bei x = 20, 130 bei x = 380 -->
  <line x1="20" y1="220" x2="380" y2="220" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M65 220V225M155 220V225M245 220V225M335 220V225" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M20 220V229M110 220V229M200 220V229M290 220V229M380 220V229" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
  <g font-size="16" fill="#1f1a12" text-anchor="middle">
    <text x="20" y="246">90</text>
    <text x="110" y="246">100</text>
    <text x="200" y="246" font-weight="700">110</text>
    <text x="290" y="246">120</text>
    <text x="380" y="246">130</text>
  </g>
  <text x="380" y="210" text-anchor="end" font-size="16" fill="#1f1a12">Zuchtwert</text>

  <!-- Gestrichelte Linie beim Mittel 100 und Linie beim Wert der Tochter 110 -->
  <line x1="110" y1="26" x2="110" y2="168" stroke="#3a2a10" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="200" y1="160" x2="200" y2="168" stroke="#3a2a10" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="110" y="18" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1a12">Mittel 100</text>

  <!-- Klammer Streuung 10 zwischen den Linien bei 100 und 110 -->
  <path d="M110 168Q110 176 118 176H147Q155 176 155 184Q155 176 163 176H192Q200 176 200 168" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <text x="155" y="202" text-anchor="middle" font-size="16" fill="#1f1a12">Streuung 10</text>

  <!-- Pfeile von Königin und Drohnen zu den Nachkommen -->
  <g fill="none" stroke="#3a2a10" stroke-width="1.5">
    <line x1="285.3" y1="55.2" x2="214.7" y2="133.7" marker-end="url(#zm-spitze)"/>
    <line x1="117.9" y1="104.4" x2="180.8" y2="139.3" marker-end="url(#zm-spitze)"/>
  </g>

  <!-- Drei Zeilen: Königin, Drohnen der Umgebung, Nachkommen -->
  <circle cx="290" cy="50" r="7" fill="#f2c14e" stroke="#3a2a10" stroke-width="1.5"/>
  <circle cx="110" cy="100" r="7" fill="#e07b39" stroke="#3a2a10" stroke-width="1.5"/>
  <circle cx="200" cy="150" r="10" fill="#b45309" stroke="#3a2a10" stroke-width="1.5"/>
  <text x="276" y="55.5" text-anchor="end" font-size="16" fill="#1f1a12">Königin 120</text>
  <text x="14" y="84" font-size="16" fill="#1f1a12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Drohnen der Umgebung 100</text>
  <text x="224" y="155.5" font-size="16" font-weight="700" fill="#1f1a12">Nachkommen 110</text>

  <!-- Formel -->
  <text x="200" y="274" text-anchor="middle" font-size="18" font-weight="700" fill="#1f1a12">(120 + 100) / 2 = 110</text>
</svg>
