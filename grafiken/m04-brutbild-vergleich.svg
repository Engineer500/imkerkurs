<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 234" role="img" aria-labelledby="m04-bv-titel m04-bv-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="234" fill="#ffffff"/>
  <title id="m04-bv-titel">Drei Brutbilder im Vergleich</title>
  <desc id="m04-bv-beschr">Drei Wabenausschnitte nebeneinander. Links ein geschlossenes Brutbild mit gleichmäßigen flachen Deckeln. In der Mitte ein lückiges Brutbild mit vielen leeren Zellen zwischen verdeckelten. Rechts eine Brutfläche mit einzelnen eingesunkenen, dunklen, durchlöcherten Deckeln zwischen normalen.</desc>

  <defs>
    <!-- Sechseckzellen, Spitze nach oben, Mittelpunkt im Ursprung, Zellweite 16,25 -->
    <!-- verdeckelte Brut: flacher Wachsdeckel als Scheibe -->
    <g id="bm-zu">
      <path d="M0-9.38L8.125-4.69V4.69L0 9.38L-8.125 4.69V-4.69Z" fill="#fff4d6" stroke="#3a2a10" stroke-width="1" stroke-opacity=".7" stroke-linejoin="round"/>
      <circle r="6.6" fill="#d9a441" stroke="#3a2a10" stroke-opacity=".55" stroke-width=".8"/>
    </g>
    <!-- leere, offene Zelle: Wachsfarbe mit dunklem Zellgrund -->
    <g id="bm-leer">
      <path d="M0-9.38L8.125-4.69V4.69L0 9.38L-8.125 4.69V-4.69Z" fill="#fff4d6" stroke="#3a2a10" stroke-width="1" stroke-opacity=".7" stroke-linejoin="round"/>
      <path d="M0-6.2L5.37-3.1V3.1L0 6.2L-5.37 3.1V-3.1Z" fill="#3a2a10" fill-opacity=".38"/>
    </g>
    <!-- eingesunkener, dunkler, durchlöcherter Deckel: dunkler Mittelpunkt mit kleinem Loch, Kontur im Akzent -->
    <g id="bm-einge">
      <path d="M0-9.38L8.125-4.69V4.69L0 9.38L-8.125 4.69V-4.69Z" fill="#fff4d6" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>
      <circle r="6.6" fill="#d9a441" stroke="#3a2a10" stroke-opacity=".55" stroke-width=".8"/>
      <circle r="3.8" fill="#5a3a1a"/>
      <circle r="1.4" fill="#1f1a12"/>
    </g>

    <!-- eine Reihe mit sechs Zellen, Mittelpunkte auf der Reihenhöhe 0 -->
    <g id="bm-reihe">
      <use href="#bm-zu" x="8.125"/>
      <use href="#bm-zu" x="24.375"/>
      <use href="#bm-zu" x="40.625"/>
      <use href="#bm-zu" x="56.875"/>
      <use href="#bm-zu" x="73.125"/>
      <use href="#bm-zu" x="89.375"/>
    </g>
    <!-- Brutfläche: acht Reihen, jede zweite um eine halbe Zelle versetzt, Ursprung links oben -->
    <g id="bm-flaeche">
      <use href="#bm-reihe" x="0" y="9.38"/>
      <use href="#bm-reihe" x="8.125" y="23.46"/>
      <use href="#bm-reihe" x="0" y="37.53"/>
      <use href="#bm-reihe" x="8.125" y="51.6"/>
      <use href="#bm-reihe" x="0" y="65.68"/>
      <use href="#bm-reihe" x="8.125" y="79.75"/>
      <use href="#bm-reihe" x="0" y="93.82"/>
      <use href="#bm-reihe" x="8.125" y="107.9"/>
    </g>
  </defs>

  <!-- Holzrahmen und Wachsgrund der drei Ausschnitte -->
  <g fill="#b45309" fill-opacity=".45" stroke="#3a2a10" stroke-width="1.5">
    <rect x="10" y="48" width="120" height="131.3" rx="4"/>
    <rect x="140" y="48" width="120" height="131.3" rx="4"/>
    <rect x="270" y="48" width="120" height="131.3" rx="4"/>
  </g>
  <g fill="#fff4d6">
    <rect x="17" y="55" width="106" height="117.3"/>
    <rect x="147" y="55" width="106" height="117.3"/>
    <rect x="277" y="55" width="106" height="117.3"/>
  </g>

  <!-- links: fast alles verdeckelt, zwei offene Zellen am Rand -->
  <use href="#bm-flaeche" x="17" y="55"/>
  <use href="#bm-leer" x="106.38" y="64.38"/>
  <use href="#bm-leer" x="33.25" y="162.89"/>

  <!-- Mitte: etwa ein Drittel der Zellen leer, ohne erkennbares Muster -->
  <use href="#bm-flaeche" x="147" y="55"/>
  <use href="#bm-leer" x="171.38" y="64.38"/>
  <use href="#bm-leer" x="220.12" y="64.38"/>
  <use href="#bm-leer" x="212" y="78.45"/>
  <use href="#bm-leer" x="155.12" y="92.53"/>
  <use href="#bm-leer" x="187.62" y="92.53"/>
  <use href="#bm-leer" x="236.38" y="92.53"/>
  <use href="#bm-leer" x="179.5" y="106.6"/>
  <use href="#bm-leer" x="228.25" y="106.6"/>
  <use href="#bm-leer" x="203.88" y="120.67"/>
  <use href="#bm-leer" x="155.12" y="120.67"/>
  <use href="#bm-leer" x="195.75" y="134.75"/>
  <use href="#bm-leer" x="244.5" y="134.75"/>
  <use href="#bm-leer" x="171.38" y="148.82"/>
  <use href="#bm-leer" x="220.12" y="148.82"/>
  <use href="#bm-leer" x="212" y="162.89"/>
  <use href="#bm-leer" x="163.25" y="162.89"/>

  <!-- rechts: überwiegend verdeckelt, fünf einzelne eingesunkene Deckel -->
  <use href="#bm-flaeche" x="277" y="55"/>
  <use href="#bm-einge" x="309.5" y="78.45"/>
  <use href="#bm-einge" x="350.12" y="92.53"/>
  <use href="#bm-einge" x="317.62" y="120.67"/>
  <use href="#bm-einge" x="358.25" y="134.75"/>
  <use href="#bm-einge" x="309.5" y="162.89"/>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16" text-anchor="middle">
    <g font-weight="700">
      <text x="70" y="38">Geschlossen</text>
      <text x="200" y="38">Lückig</text>
      <text x="330" y="20">Eingesunkene</text>
      <text x="330" y="38">Deckel</text>
    </g>
    <text x="70" y="202">Normalfall</text>
    <text x="200" y="202">viele Ursachen</text>
    <text x="330" y="202">Verdacht</text>
    <text x="330" y="221">Faulbrut</text>
  </g>
</svg>
