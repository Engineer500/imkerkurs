<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-labelledby="m11-sa-titel m11-sa-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="340" fill="#ffffff"/>
  <title id="m11-sa-titel">Das Schied im Zandermaß</title>
  <desc id="m11-sa-beschr">Das Schied von vorn und im Schnitt. Vorn: eine Platte von 420 mm Breite mit einem Oberträger von 477 mm, zusammen 220 mm hoch. Im Schnitt: eine Sperrholzplatte von 8 mm unter dem Oberträger, beidseitig mit Thermofolie beklebt, zwischen den Oberträgern je 7 mm Spalt zu den Nachbarwaben.</desc>

  <defs>
    <!-- Schraffur der Platte in der Vorderansicht -->
    <pattern id="m11-sa-schraeg" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#d8d2c4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3a2a10" stroke-width="1.400" stroke-opacity=".6"/>
    </pattern>
    <!-- Luftpolster der Thermofolie: feines Wellenmuster auf Metallfarbe -->
    <pattern id="m11-sa-welle" width="9.600" height="6" patternUnits="userSpaceOnUse">
      <rect width="9.600" height="6" fill="#b8bcc2"/>
      <path d="M0 3Q2.400 0 4.800 3T9.600 3" fill="none" stroke="#3a2a10" stroke-width=".8" stroke-opacity=".6"/>
    </pattern>
    <!-- Blasse Umrisse der Nachbarwaben, nach unten ausgeblendet -->
    <linearGradient id="m11-sa-blass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a10" stop-opacity=".6"/>
      <stop offset="1" stop-color="#3a2a10" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ===== Vorderansicht ===== -->
  <text x="20" y="20" font-size="18" font-weight="700" fill="#1f1a12">Vorderansicht</text>

  <!-- Maßlinie Oberträger 477 mm -->
  <g stroke="#3a2a10" stroke-width="1">
    <line x1="74.600" y1="44" x2="74.600" y2="57"/>
    <line x1="265.400" y1="44" x2="265.400" y2="57"/>
    <line x1="74.600" y1="48" x2="265.400" y2="48"/>
  </g>
  <path d="M74.600 48L83 44.500V51.500ZM265.400 48L257 44.500V51.500Z" fill="#3a2a10"/>
  <text x="170" y="40" text-anchor="middle" font-size="16" fill="#1f1a12">Oberträger <tspan font-weight="700" fill="#b45309">477 mm</tspan></text>

  <!-- Oberträger (10 mm, steht je etwa 12 über) und Platte (210 mm hoch), zusammen 220 mm -->
  <rect x="74.600" y="58" width="190.800" height="4" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.500"/>
  <rect x="86" y="62" width="168" height="84" fill="url(#m11-sa-schraeg)" stroke="#3a2a10" stroke-width="1.500"/>

  <!-- Maßlinie Platte 420 mm -->
  <g stroke="#3a2a10" stroke-width="1">
    <line x1="86" y1="148" x2="86" y2="160"/>
    <line x1="254" y1="148" x2="254" y2="160"/>
    <line x1="86" y1="156" x2="254" y2="156"/>
  </g>
  <path d="M86 156L94.400 152.500V159.500ZM254 156L245.600 152.500V159.500Z" fill="#3a2a10"/>
  <text x="170" y="178" text-anchor="middle" font-size="16" fill="#1f1a12">Platte <tspan font-weight="700" fill="#b45309">420 mm</tspan></text>

  <!-- Maßpfeil 220 mm über die ganze Höhe -->
  <g stroke="#3a2a10" stroke-width="1">
    <line x1="268" y1="58" x2="296" y2="58"/>
    <line x1="256" y1="146" x2="296" y2="146"/>
    <line x1="292" y1="58" x2="292" y2="146"/>
  </g>
  <path d="M292 58L288.500 66.400H295.500ZM292 146L288.500 137.600H295.500Z" fill="#3a2a10"/>
  <text x="302" y="107.500" font-size="16" font-weight="700" fill="#b45309">220 mm</text>

  <line x1="20" y1="190" x2="380" y2="190" stroke="#3a2a10" stroke-opacity=".25" stroke-width="1"/>

  <!-- ===== Schnitt quer zu den Waben (3,2 Einheiten je mm) ===== -->
  <text x="20" y="210" font-size="18" font-weight="700" fill="#1f1a12">Schnitt</text>

  <!-- Nachbarwaben als blasse Umrisse -->
  <g fill="none" stroke="url(#m11-sa-blass)" stroke-width="1.500">
    <rect x="81" y="266" width="14" height="24"/>
    <rect x="305" y="266" width="14" height="24"/>
  </g>

  <!-- Oberträger: Nachbar links, Schied, Nachbar rechts, je 7 mm Spalt dazwischen -->
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1.200">
    <rect x="43.200" y="250" width="89.600" height="16"/>
    <rect x="155.200" y="250" width="89.600" height="16"/>
    <rect x="267.200" y="250" width="89.600" height="16"/>
  </g>

  <!-- Sperrholzplatte 8 mm mit Maserung, mittig unter dem Oberträger des Schieds -->
  <rect x="187.200" y="266" width="25.600" height="32" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.200"/>
  <path d="M191 268Q193 280 191 292M196.500 268Q198.500 284 196.500 296M203.500 268Q205.500 280 203.500 292M209 268Q211 284 209 294" fill="none" stroke="#3a2a10" stroke-width=".8" stroke-opacity=".5"/>
  <!-- Thermofolie beidseitig, etwas länger als die Platte -->
  <g fill="url(#m11-sa-welle)" stroke="#3a2a10" stroke-width="1.200">
    <rect x="177.600" y="266" width="9.600" height="40"/>
    <rect x="212.800" y="266" width="9.600" height="40"/>
  </g>

  <!-- Linien: Spalt von oben, Sperrholz von rechts über die Folie, Thermofolie von unten, je Seite eine -->
  <g fill="none" stroke="#3a2a10" stroke-width="1">
    <path d="M144 238V258"/>
    <path d="M205 287L236 296"/>
    <path d="M182.400 301L176 318"/>
    <path d="M217.600 301L224 318"/>
  </g>
  <g fill="#3a2a10">
    <circle cx="144" cy="258" r="2.500"/>
    <circle cx="205" cy="287" r="2.500"/>
    <circle cx="182.400" cy="301" r="2.500"/>
    <circle cx="217.600" cy="301" r="2.500"/>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="144" y="234" text-anchor="middle"><tspan font-weight="700" fill="#b45309">7 mm</tspan> Spalt</text>
    <text x="240" y="302">Sperrholz <tspan font-weight="700" fill="#b45309">8 mm</tspan></text>
    <text x="200" y="334" text-anchor="middle">Thermofolie, beidseitig</text>
  </g>
</svg>
