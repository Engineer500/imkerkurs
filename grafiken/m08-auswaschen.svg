<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="m08-aw-titel m08-aw-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="480" fill="#ffffff"/>
  <title id="m08-aw-titel">Auswaschen in fünf Schritten</title>
  <desc id="m08-aw-beschr">Fünf Schritte zum Auswaschen. Erstens etwa 300 Bienen nehmen, rund 30 g, und den Probenort notieren. Zweitens einfrieren. Drittens das Glas zu zwei Dritteln mit Wasser und Spülmittel füllen und schütteln. Viertens eine Viertelstunde bis eine Stunde stehen lassen und erneut schütteln. Fünftens durch ein Doppelsieb spülen und die Milben zählen. Befall in Prozent gleich Milben geteilt durch Bienen mal 100, 3 Milben auf 300 Bienen sind 1 Prozent.</desc>

  <defs>
    <!-- Feine Sechseckstruktur der Wabe (wie in m01-wabe-aufbau.svg) -->
    <pattern id="m08-aw-sechseck" width="12.124" height="21" patternUnits="userSpaceOnUse">
      <path d="M0 3.5L6.062 0L12.124 3.5V10.5L6.062 14L0 10.5ZM6.062 14V21" fill="none" stroke="#3a2a10" stroke-width=".9" stroke-opacity=".4"/>
    </pattern>
    <!-- Gitter der Siebe -->
    <pattern id="m08-aw-gitter" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4M0 0V4" fill="none" stroke="#3a2a10" stroke-width=".7" stroke-opacity=".6"/>
    </pattern>

    <!-- BIENENFORM: Arbeiterin, Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust (wie in m01) -->
    <g id="m08-aw-biene">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-11" cy="-10.9" rx="12.5" ry="5.2" transform="rotate(28 -11 -10.9)"/>
        <ellipse cx="-5.4" cy="-15.2" rx="11.5" ry="4.8" transform="rotate(62 -5.4 -15.2)"/>
      </g>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-12.5" cy="2" rx="12.5" ry="7.5" fill="#f2c14e"/>
        <path d="M-12.6 -5.5A12.5 7.5 0 0 1 -9.6 -5.3L-9.6 9.3A12.5 7.5 0 0 1 -12.6 9.5ZM-18.4 -4.61A12.5 7.5 0 0 1 -15.4 -5.3L-15.4 9.3A12.5 7.5 0 0 1 -18.4 8.61ZM-24.2 -0.64A12.5 7.5 0 0 1 -21.2 -3.39L-21.2 7.39A12.5 7.5 0 0 1 -24.2 4.64Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
    </g>

    <!-- MILBE: Varroamilbe von oben, breit-ovaler rotbrauner Körper mit vier Beinpaaren -->
    <g id="m08-aw-milbe">
      <path d="M-3.5 -3L-7.5 -6.5M-1.5 -3.8L-3.5 -8M1.5 -3.8L3.5 -8M3.5 -3L7.5 -6.5M-3.5 3L-7.5 6.5M-1.5 3.8L-3.5 8M1.5 3.8L3.5 8M3.5 3L7.5 6.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse rx="6.5" ry="5" fill="#b8322a" stroke="#3a2a10" stroke-width="1.2"/>
      <ellipse cx="-1.5" cy="-1.5" rx="2.6" ry="1.5" fill="#ffffff" fill-opacity=".35"/>
    </g>

    <!-- Schneeflocke: ein Arm, sechsmal gedreht -->
    <path id="m08-aw-arm" d="M0 0H12M6.5 0L10.5 -3.8M6.5 0L10.5 3.8" fill="none" stroke="#4a7fb5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Glas mit Deckelrand und Wasser bis zwei Drittel, Ursprung in der Mitte des Glasbodens -->
    <g id="m08-aw-glas">
      <rect x="-14" y="-46" width="28" height="46" rx="4" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5"/>
      <path d="M-14 -30.7H14V-4A4 4 0 0 1 10 0H-10A4 4 0 0 1 -14 -4Z" fill="#4a7fb5" fill-opacity=".45"/>
      <line x1="-14" y1="-30.7" x2="14" y2="-30.7" stroke="#4a7fb5" stroke-width="2"/>
      <rect x="-14" y="-46" width="28" height="46" rx="4" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
      <rect x="-16" y="-52" width="32" height="7" rx="2" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5"/>
      <g fill="#f2c14e" stroke="#3a2a10" stroke-width=".8">
        <ellipse cx="-6" cy="-12" rx="4" ry="2.2" transform="rotate(-20 -6 -12)"/>
        <ellipse cx="5" cy="-8" rx="4" ry="2.2" transform="rotate(25 5 -8)"/>
        <ellipse cx="-2" cy="-21" rx="4" ry="2.2" transform="rotate(10 -2 -21)"/>
      </g>
    </g>
  </defs>

  <!-- Zeilenkästen -->
  <g fill="#fffaf0" stroke="#3a2a10" stroke-width="1.5">
    <rect x="8" y="10" width="384" height="56" rx="8"/>
    <rect x="8" y="80" width="384" height="44" rx="8"/>
    <rect x="8" y="138" width="384" height="70" rx="8"/>
    <rect x="8" y="222" width="384" height="70" rx="8"/>
    <rect x="8" y="306" width="384" height="60" rx="8"/>
  </g>

  <!-- Pfeile nach unten zwischen den Zeilen -->
  <g stroke="#3a2a10" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M28 67V74M28 125V132M28 209V216M28 293V300M28 367V374"/>
  </g>
  <g fill="#3a2a10">
    <path d="M22.5 73L33.5 73L28 79Z"/>
    <path d="M22.5 131L33.5 131L28 137Z"/>
    <path d="M22.5 215L33.5 215L28 221Z"/>
    <path d="M22.5 299L33.5 299L28 305Z"/>
    <path d="M22.5 373L33.5 373L28 379Z"/>
  </g>

  <!-- Nummernkreise -->
  <g fill="#b45309">
    <circle cx="28" cy="38" r="13"/>
    <circle cx="28" cy="102" r="13"/>
    <circle cx="28" cy="173" r="13"/>
    <circle cx="28" cy="257" r="13"/>
    <circle cx="28" cy="336" r="13"/>
  </g>
  <g fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">
    <text x="28" y="43.5">1</text>
    <text x="28" y="107.5">2</text>
    <text x="28" y="178.5">3</text>
    <text x="28" y="262.5">4</text>
    <text x="28" y="341.5">5</text>
  </g>

  <!-- Symbol 1: Wabe mit wenigen Bienen -->
  <rect x="52" y="17" width="56" height="42" rx="3" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="57" y="22" width="46" height="32" fill="#fff4d6"/>
  <rect x="57" y="22" width="46" height="32" fill="url(#m08-aw-sechseck)"/>
  <rect x="57" y="22" width="46" height="32" fill="none" stroke="#3a2a10" stroke-width="1"/>
  <use href="#m08-aw-biene" transform="translate(73 32) rotate(-14) scale(.4)"/>
  <use href="#m08-aw-biene" transform="translate(94 38) rotate(12) scale(-.4 .4)"/>
  <use href="#m08-aw-biene" transform="translate(76 48) rotate(8) scale(.4)"/>

  <!-- Symbol 2: Schneeflocke -->
  <g transform="translate(80 102) scale(1.45)">
    <use href="#m08-aw-arm"/>
    <use href="#m08-aw-arm" transform="rotate(60)"/>
    <use href="#m08-aw-arm" transform="rotate(120)"/>
    <use href="#m08-aw-arm" transform="rotate(180)"/>
    <use href="#m08-aw-arm" transform="rotate(240)"/>
    <use href="#m08-aw-arm" transform="rotate(300)"/>
    <circle r="2" fill="#ffffff" stroke="#4a7fb5" stroke-width="1.2"/>
  </g>

  <!-- Symbol 3: Glas zu zwei Dritteln gefüllt, zwei Schüttelpfeile -->
  <use href="#m08-aw-glas" transform="translate(80 198)"/>
  <g stroke="#3a2a10" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M55 158V190M105 158V190"/>
  </g>
  <g fill="#3a2a10">
    <path d="M55 153L50.5 160.5H59.5ZM55 195L50.5 187.5H59.5Z"/>
    <path d="M105 153L100.5 160.5H109.5ZM105 195L100.5 187.5H109.5Z"/>
  </g>

  <!-- Symbol 4: Glas mit Uhr -->
  <use href="#m08-aw-glas" transform="translate(70 282)"/>
  <circle cx="98" cy="246" r="12" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5"/>
  <g stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M98 246V238.5M98 246L103.5 249"/>
  </g>
  <g stroke="#3a2a10" stroke-width="1" stroke-linecap="round">
    <path d="M98 235.5V237M98 256.5V255M87.5 246H89M108.5 246H107"/>
  </g>

  <!-- Symbol 5: Doppelsieb, oben Bienen, darunter im feinen Sieb die Milben -->
  <use href="#m08-aw-biene" transform="translate(66 322) rotate(-8) scale(.4)"/>
  <use href="#m08-aw-biene" transform="translate(84 320) rotate(6) scale(-.4 .4)"/>
  <use href="#m08-aw-biene" transform="translate(102 322) rotate(-6) scale(.4)"/>
  <path d="M54 326H106L98 335H62Z" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M56 327H104L97 334H63Z" fill="url(#m08-aw-gitter)"/>
  <use href="#m08-aw-milbe" transform="translate(68 344) scale(.62)"/>
  <use href="#m08-aw-milbe" transform="translate(82 344) scale(.62)"/>
  <use href="#m08-aw-milbe" transform="translate(96 344) scale(.62)"/>
  <path d="M54 349H106L98 358H62Z" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M56 350H104L97 357H63Z" fill="url(#m08-aw-gitter)"/>

  <!-- Rechenkasten -->
  <rect x="8" y="382" width="384" height="86" rx="8" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.5"/>
  <line x1="24" y1="438" x2="376" y2="438" stroke="#3a2a10" stroke-width="1" stroke-opacity=".5"/>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="124" y="33.5">Etwa 300 Bienen, rund 30 g,</text>
    <text x="124" y="53.5">Probenort notieren</text>
    <text x="124" y="107.5">Einfrieren</text>
    <text x="124" y="158.5">Glas zu zwei Dritteln mit</text>
    <text x="124" y="178.5">Wasser und Spülmittel füllen,</text>
    <text x="124" y="198.5">schütteln</text>
    <text x="124" y="242.5">Eine Viertelstunde bis eine</text>
    <text x="124" y="262.5">Stunde stehen lassen,</text>
    <text x="124" y="282.5">erneut schütteln</text>
    <text x="124" y="331.5">Durch ein Doppelsieb spülen,</text>
    <text x="124" y="351.5">Milben zählen</text>
    <text x="24" y="407" font-weight="700">Befall in % = Milben geteilt durch</text>
    <text x="24" y="427" font-weight="700">Bienen mal 100</text>
    <text x="24" y="460" font-weight="700" fill="#b45309">3 Milben auf 300 Bienen = 1 %</text>
  </g>
</svg>
