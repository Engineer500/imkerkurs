<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="m11-wz-titel m11-wz-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="300" fill="#ffffff"/>
  <title id="m11-wz-titel">Waben ziehen statt kippen</title>
  <desc id="m11-wz-beschr">Zwei Schritte der Wabenkontrolle von oben. Oben: Honigraum abgenommen, Schied einseitig gelöst, die erste Wabe wird in die Wabenkiste gezogen. Unten: Nach der Kontrolle hängt das Brutnest wieder in der alten Reihenfolge zwischen den Schieden.</desc>

  <defs>
    <!-- Zellmuster: regelmäßige Sechsecke mit senkrechten Seitenwänden, waagrecht versetzte Reihen -->
    <pattern id="m11-wz-zellen" width="7.500" height="12.990" patternUnits="userSpaceOnUse">
      <path d="M0 2.165L3.750 0L7.500 2.165V6.495L3.750 8.660L0 6.495ZM3.750 8.660V12.990" fill="none" stroke="#3a2a10" stroke-width=".9" stroke-opacity=".55"/>
    </pattern>
    <!-- Schraffur des Schieds -->
    <pattern id="m11-wz-schraeg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#d8d2c4"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#3a2a10" stroke-width="1.500" stroke-opacity=".75"/>
    </pattern>
    <!-- Punktmuster des Drohnenrähmchens -->
    <pattern id="m11-wz-punkte" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.500" cy="2.500" r="1.100" fill="#3a2a10" fill-opacity=".7"/>
    </pattern>

    <!-- Ein Platz, Ursprung links oben, 30 breit und 36 hoch -->
    <g id="m11-wz-schied">
      <rect x="7.500" y="0" width="15" height="36" fill="url(#m11-wz-schraeg)" stroke="#3a2a10" stroke-width="1.200"/>
    </g>
    <g id="m11-wz-brut">
      <rect width="30" height="36" fill="#d9a441"/>
      <rect width="30" height="36" fill="url(#m11-wz-zellen)" stroke="#3a2a10" stroke-width="1.500"/>
    </g>
    <g id="m11-wz-drohne">
      <rect width="30" height="36" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.500"/>
      <rect x="4" y="4" width="22" height="28" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
      <rect x="4" y="4" width="22" height="28" fill="url(#m11-wz-punkte)"/>
    </g>
  </defs>

  <!-- ===== Schritt 1: Wabe ziehen ===== -->
  <text x="20" y="22" font-size="18" font-weight="700" fill="#1f1a12">1. Wabe ziehen</text>

  <!-- Honigraum, abgenommen und daneben abgestellt: kleine Zarge von oben -->
  <rect x="300" y="6" width="80" height="28" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.500"/>
  <rect x="304" y="10" width="72" height="20" fill="#f2c14e" stroke="#3a2a10" stroke-width="1"/>
  <path d="M318.400 10V30M332.800 10V30M347.200 10V30M361.600 10V30" fill="none" stroke="#3a2a10" stroke-width="1" stroke-opacity=".6"/>

  <!-- Zarge von oben: zehn Plätze zu 30 Breite und 4 Abstand -->
  <rect x="16" y="60" width="344" height="44" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.500"/>
  <!-- Schied einseitig gelöst: leicht schräg, gestrichelt -->
  <g transform="rotate(14 35 82)">
    <rect x="27.500" y="64" width="15" height="36" fill="url(#m11-wz-schraeg)" stroke="#3a2a10" stroke-width="1.200" stroke-dasharray="3 2"/>
  </g>
  <use href="#m11-wz-brut" x="54" y="64"/>
  <use href="#m11-wz-brut" x="88" y="64"/>
  <use href="#m11-wz-brut" x="122" y="64"/>
  <use href="#m11-wz-brut" x="156" y="64"/>
  <use href="#m11-wz-brut" x="190" y="64"/>
  <use href="#m11-wz-brut" x="224" y="64"/>
  <use href="#m11-wz-brut" x="258" y="64"/>
  <use href="#m11-wz-drohne" x="292" y="64"/>
  <use href="#m11-wz-schied" x="326" y="64"/>
  <!-- Die erste Wabe mit Akzentrahmen -->
  <rect x="54" y="64" width="30" height="36" fill="none" stroke="#b45309" stroke-width="2.500"/>

  <!-- Pfeil: erste Wabe wird nach rechts in die Wabenkiste gezogen -->
  <path d="M69 106V128H238" fill="none" stroke="#b45309" stroke-width="2.500" stroke-linejoin="round"/>
  <path d="M248 128L238 123V133Z" fill="#b45309" stroke="#b45309" stroke-width="1" stroke-linejoin="round"/>

  <!-- Wabenkiste am Rand, mit der gezogenen Wabe darin -->
  <rect x="250" y="108" width="130" height="40" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.500"/>
  <rect x="256" y="114" width="118" height="28" fill="#fffaf0" stroke="#3a2a10" stroke-width="1"/>
  <rect x="262" y="117" width="14" height="22" fill="#d9a441"/>
  <rect x="262" y="117" width="14" height="22" fill="url(#m11-wz-zellen)" stroke="#3a2a10" stroke-width="1.200"/>

  <!-- Linie zum gelösten Schied -->
  <path d="M35 56V66" fill="none" stroke="#3a2a10" stroke-width="1"/>
  <circle cx="35" cy="66" r="2.500" fill="#3a2a10"/>

  <line x1="20" y1="160" x2="380" y2="160" stroke="#3a2a10" stroke-opacity=".25" stroke-width="1"/>

  <!-- ===== Schritt 2: Zurückhängen ===== -->
  <text x="20" y="182" font-size="18" font-weight="700" fill="#1f1a12">2. Zurückhängen</text>

  <!-- Ziffern über den Waben -->
  <g fill="#1f1a12" font-size="16" font-weight="700" text-anchor="middle">
    <text x="69" y="208">1</text>
    <text x="103" y="208">2</text>
    <text x="137" y="208">3</text>
    <text x="171" y="208">4</text>
    <text x="205" y="208">5</text>
    <text x="239" y="208">6</text>
    <text x="273" y="208">7</text>
  </g>

  <!-- Dieselbe Zarge nach der Kontrolle: Reihenfolge wie vorher, beide Schiede an der alten Stelle -->
  <rect x="16" y="214" width="344" height="44" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.500"/>
  <use href="#m11-wz-schied" x="20" y="218"/>
  <use href="#m11-wz-brut" x="54" y="218"/>
  <use href="#m11-wz-brut" x="88" y="218"/>
  <use href="#m11-wz-brut" x="122" y="218"/>
  <use href="#m11-wz-brut" x="156" y="218"/>
  <use href="#m11-wz-brut" x="190" y="218"/>
  <use href="#m11-wz-brut" x="224" y="218"/>
  <use href="#m11-wz-brut" x="258" y="218"/>
  <use href="#m11-wz-drohne" x="292" y="218"/>
  <use href="#m11-wz-schied" x="326" y="218"/>

  <!-- Klammer unter den sieben Waben -->
  <path d="M54 263Q54 269 62 269H163Q171 269 171 275Q171 269 179 269H280Q288 269 288 263" fill="none" stroke="#3a2a10" stroke-width="1.500" stroke-linecap="round"/>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="292" y="25" text-anchor="end">Honigraum ab</text>
    <text x="20" y="52">Schied gelöst</text>
    <text x="80" y="120">erste Wabe</text>
    <text x="322" y="133.500" text-anchor="middle">Wabenkiste</text>
    <text x="171" y="294" text-anchor="middle">Reihenfolge wie vorher</text>
  </g>
</svg>
