<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="m11-nb-titel m11-nb-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="320" fill="#ffffff"/>
  <title id="m11-nb-titel">Der Ablauf nach der Brutentnahme</title>
  <desc id="m11-nb-beschr">Zeitleiste ab der Brutentnahme in Tagen. Tag 0: Brutwaben heraus, Mittelwände einhängen, einmal Oxalsäure sprühen, dünn füttern. Tag 3: erste Eier. Tag 4 bis 5: kurz nachsehen. Ab Tag 14: 3 bis 7 Tage Gemüll zählen, Ziel unter 0,5 Milben pro Tag. Rechts zwei Balken: bis Tag 14 fallen Milben ab, danach wird gezählt.</desc>

  <defs>
    <!-- BIENENFORM: Arbeiterin, Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust (wie in m01) -->
    <g id="m11-nb-biene">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.100">
        <ellipse cx="-11" cy="-10.900" rx="12.500" ry="5.200" transform="rotate(28 -11 -10.900)"/>
        <ellipse cx="-5.400" cy="-15.200" rx="11.500" ry="4.800" transform="rotate(62 -5.400 -15.200)"/>
      </g>
      <path d="M-3 6.500L-6 12.500M1 7.200L1.500 13.500M4.500 6.500L8.500 11.500" fill="none" stroke="#3a2a10" stroke-width="1.200" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.500">
        <ellipse cx="-12.500" cy="2" rx="12.500" ry="7.500" fill="#f2c14e"/>
        <path d="M-12.600 -5.500A12.500 7.500 0 0 1 -9.600 -5.300L-9.600 9.300A12.500 7.500 0 0 1 -12.600 9.500ZM-18.400 -4.610A12.500 7.500 0 0 1 -15.400 -5.300L-15.400 9.300A12.500 7.500 0 0 1 -18.400 8.610ZM-24.200 -0.640A12.500 7.500 0 0 1 -21.200 -3.390L-21.200 7.390A12.500 7.500 0 0 1 -24.200 4.640Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.800" ry="7.200" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.500 -9M14.500 -1.500L21 -5.500" fill="none" stroke="#3a2a10" stroke-width="1.200" stroke-linecap="round"/>
      <ellipse cx="10.600" cy="0.600" rx="5" ry="4.800" fill="#3a2a10"/>
      <circle cx="12.200" cy="-0.800" r="1.300" fill="#ffffff"/>
    </g>
    <!-- Schrägschraffur: Milbenfall nach dem Sprühen -->
    <pattern id="m11-nb-schraeg" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#d8d2c4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#3a2a10" stroke-width="1.600" stroke-opacity=".65"/>
    </pattern>
    <!-- Punktmuster: Gemüll zählen -->
    <pattern id="m11-nb-punkte" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f2c14e" fill-opacity=".45"/>
      <circle cx="3" cy="3" r="1.400" fill="#3a2a10" fill-opacity=".8"/>
    </pattern>
  </defs>

  <!-- Zeitachse: oben Tag 0, unten Tag 21, Abstände schematisch -->
  <line x1="126" y1="30" x2="126" y2="284" stroke="#3a2a10" stroke-width="2.500"/>
  <path d="M119 282L126 296L133 282Z" fill="#3a2a10"/>
  <!-- Marker: Tag 0, Tag 3, Tag 4 bis 5, Tag 14 -->
  <g fill="#3a2a10" stroke="#ffffff" stroke-width="2">
    <circle cx="126" cy="40" r="7"/>
    <circle cx="126" cy="105" r="7"/>
    <circle cx="126" cy="150" r="7"/>
    <circle cx="126" cy="225" r="7"/>
  </g>

  <!-- Zwei senkrechte Balken rechts: Milbenfall von Tag 0 bis Tag 14, danach Gemüll zählen -->
  <g stroke="#3a2a10" stroke-width="1">
    <line x1="336" y1="40" x2="346" y2="40"/>
    <line x1="340" y1="105" x2="346" y2="105"/>
    <line x1="340" y1="150" x2="346" y2="150"/>
    <line x1="336" y1="225" x2="346" y2="225"/>
  </g>
  <rect x="346" y="40" width="26" height="185" fill="url(#m11-nb-schraeg)" stroke="#3a2a10" stroke-width="1.500"/>
  <rect x="346" y="225" width="26" height="65" fill="url(#m11-nb-punkte)" stroke="#3a2a10" stroke-width="1.500"/>

  <!-- Biene bei Tag 0 -->
  <use href="#m11-nb-biene" transform="translate(166 84) scale(.6)"/>

  <!-- Zählbrett mit Milbenpunkten bei Tag 14 -->
  <rect x="140" y="258" width="68" height="28" rx="2" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.500"/>
  <g fill="#b45309" stroke="#3a2a10" stroke-width=".6">
    <ellipse cx="152" cy="266" rx="2.600" ry="2"/>
    <ellipse cx="167" cy="276" rx="2.600" ry="2"/>
    <ellipse cx="176" cy="264" rx="2.600" ry="2"/>
    <ellipse cx="188" cy="274" rx="2.600" ry="2"/>
    <ellipse cx="198" cy="265" rx="2.600" ry="2"/>
    <ellipse cx="155" cy="279" rx="2.600" ry="2"/>
  </g>

  <!-- Tagesbeschriftungen links der Linie, rechtsbündig -->
  <g fill="#b45309" font-size="16" text-anchor="end">
    <text x="112" y="45.500">Tag 0</text>
    <text x="112" y="110.500">Tag 3</text>
    <text x="112" y="155.500">Tag 4 bis 5</text>
    <text x="112" y="230.500">Tag 14</text>
  </g>

  <!-- Texte rechts der Linie -->
  <g fill="#1f1a12" font-size="16">
    <text x="140" y="45.500">Entnehmen, sprühen,</text>
    <text x="140" y="63.500">füttern</text>
    <text x="140" y="110.500">erste Eier</text>
    <text x="140" y="155.500">kurz nachsehen</text>
    <text x="140" y="230.500">Gemüll zählen,</text>
    <text x="140" y="248.500">Ziel unter 0,5 pro Tag</text>
  </g>

  <!-- Beschriftung der beiden Balken, senkrecht von oben nach unten gelesen -->
  <g fill="#1f1a12" font-size="16">
    <text transform="translate(378 52) rotate(90)">Milben fallen ab</text>
    <text transform="translate(378 232) rotate(90)">Zählen</text>
  </g>
</svg>
