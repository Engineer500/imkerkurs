<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="m01-gk-titel m01-gk-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>
  <title id="m01-gk-titel">Vom Ei zu Drohn, Königin und Arbeiterin</title>
  <desc id="m01-gk-beschr">Entscheidungsbaum: Ein unbefruchtetes Ei wird zum Drohn. Ein befruchtetes Ei wird zum Weibchen. Bekommt die Larve reichlich Gelée royale, wird sie zur Königin, bekommt sie Arbeiterinnenfutter, wird sie zur Arbeiterin.</desc>

  <!-- Pfeile: Linien und Spitzen -->
  <g fill="none" stroke="#3a2a10" stroke-width="1.5">
    <path d="M163 85L163 114"/>
    <path d="M126 181L87.8 251.2"/>
    <path d="M200 181L238.2 251.2"/>
    <path d="M171 319L171 408"/>
    <path d="M291 319L291 408"/>
  </g>
  <g fill="#3a2a10">
    <path d="M163 124L158 114L168 114Z"/>
    <path d="M83 260L83.4 248.8L92.2 253.6Z"/>
    <path d="M243 260L233.8 253.6L242.6 248.8Z"/>
    <path d="M171 418L166 408L176 408Z"/>
    <path d="M291 418L286 408L296 408Z"/>
  </g>

  <!-- Reihe 1: das Ei -->
  <path d="M163 25C177 25 185 47 185 63C185 76 175 83 163 83C151 83 141 76 141 63C141 47 149 25 163 25Z" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Reihe 2: die Frage -->
  <path d="M163 124L237 162L163 200L89 162Z" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Reihe 3: Drohn (Endpunkt) und Weibchen -->
  <rect x="27" y="262" width="104" height="56" rx="16" fill="#4a7fb5" fill-opacity=".32" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="151" y="262" width="156" height="56" rx="6" fill="#3a2a10" fill-opacity=".08" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Reihe 4: Königin und Arbeiterin -->
  <rect x="123" y="420" width="96" height="56" rx="10" fill="#b45309" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="237" y="420" width="108" height="56" rx="10" fill="#f2c14e" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- weiße Felder unter den Pfeilbeschriftungen: Die Texte sitzen mittig auf den Pfeilen -->
  <g fill="#ffffff">
    <rect x="141" y="339" width="60" height="42"/>
    <rect x="211" y="349" width="160" height="23"/>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="163" y="68.5" text-anchor="middle" font-size="16" font-weight="700">Ei</text>
    <text x="163" y="167.5" text-anchor="middle" font-size="16" font-weight="700">befruchtet?</text>
    <text x="95" y="224" text-anchor="end" font-size="16">nein</text>
    <text x="232" y="224" font-size="16">ja</text>
    <text x="79" y="295.5" text-anchor="middle" font-size="16" font-weight="700">Drohn</text>
    <text x="229" y="295.5" text-anchor="middle" font-size="16" font-weight="700">Weibchen</text>
    <text x="171" y="354" text-anchor="middle" font-size="16">Gelée</text>
    <text x="171" y="374" text-anchor="middle" font-size="16">royale</text>
    <text x="291" y="365" text-anchor="middle" font-size="16">Arbeiterinnenfutter</text>
    <text x="171" y="453.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Königin</text>
    <text x="291" y="453.5" text-anchor="middle" font-size="16" font-weight="700">Arbeiterin</text>
  </g>
</svg>
