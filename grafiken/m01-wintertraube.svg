<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="m01-wt-titel m01-wt-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="400" fill="#ffffff"/>
  <title id="m01-wt-titel">Die Wintertraube ohne Brut</title>
  <desc id="m01-wt-beschr">Schnitt durch eine Wintertraube: In der Mitte sitzt die Königin im Kern, der ohne Brut im Mittel 21 bis 22 °C warm ist. Darum liegt der Mantel mit 10 bis 15 °C. Pfeile zeigen den Platzwechsel der Bienen. Außerhalb der Traube liegt eine einzelne Biene in Kältestarre, die unter etwa 9 bis 10 °C beginnt.</desc>

  <defs>
    <!-- BIENENFORM: Königin. Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust.
         Länger und schlanker als die Arbeiterin (etwa 50 statt 40 Einheiten), Flügel kürzer als der Hinterleib. -->
    <g id="biene-koenigin">
      <!-- Flügel: halbtransparent, hinter dem Körper -->
      <g id="biene-koenigin-fluegel" fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-9.3" cy="-9.9" rx="10.5" ry="4.6" transform="rotate(28 -9.3 -9.9)"/>
        <ellipse cx="-5.5" cy="-12.8" rx="9.5" ry="4.2" transform="rotate(55 -5.5 -12.8)"/>
      </g>
      <!-- Beine -->
      <path id="biene-koenigin-beine" d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Rumpf: langer Hinterleib mit drei dunklen Streifen, davor die Brust -->
      <g id="biene-koenigin-rumpf" stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-17.5" cy="2" rx="17.5" ry="7.2" fill="#f2c14e"/>
        <path d="M-15 -5.13A17.5 7.2 0 0 1 -12 -4.84L-12 8.84A17.5 7.2 0 0 1 -15 9.13ZM-21.5 -5.01A17.5 7.2 0 0 1 -18.5 -5.19L-18.5 9.19A17.5 7.2 0 0 1 -21.5 9.01ZM-28 -3.76A17.5 7.2 0 0 1 -25 -4.51L-25 8.51A17.5 7.2 0 0 1 -28 7.76Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <!-- Kopf mit Auge und Fühlern -->
      <g id="biene-koenigin-kopf">
        <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
        <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
        <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
      </g>
    </g>

    <!-- BIENENFORM: Arbeiterin, hier nur Rumpf und Kopf für die Biene in Kältestarre -->
    <g id="biene-arbeiterin-rumpf" stroke="#3a2a10" stroke-width="1.5">
      <ellipse cx="-12.5" cy="2" rx="12.5" ry="7.5" fill="#f2c14e"/>
      <path d="M-12.6 -5.5A12.5 7.5 0 0 1 -9.6 -5.3L-9.6 9.3A12.5 7.5 0 0 1 -12.6 9.5ZM-18.4 -4.61A12.5 7.5 0 0 1 -15.4 -5.3L-15.4 9.3A12.5 7.5 0 0 1 -18.4 8.61ZM-24.2 -0.64A12.5 7.5 0 0 1 -21.2 -3.39L-21.2 7.39A12.5 7.5 0 0 1 -24.2 4.64Z" fill="#3a2a10" stroke="none"/>
      <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
    </g>
    <g id="biene-arbeiterin-kopf">
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
    </g>

    <!-- kleiner Bienenkörper in der Traube -->
    <ellipse id="wt-biene" rx="8" ry="4.5" fill="#f2c14e" stroke="#3a2a10" stroke-width=".9"/>

    <!-- Pfeilspitze für den Platzwechsel, weiß umrandet -->
    <marker id="wt-spitze" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>

    <!-- Leitlinien zu den Beschriftungen -->
    <g id="wt-leit" fill="none" stroke-linecap="round">
      <line x1="281" y1="60" x2="217" y2="91"/>
      <line x1="281" y1="114" x2="176" y2="134"/>
      <line x1="281" y1="210" x2="161" y2="173"/>
      <line x1="281" y1="252" x2="193" y2="240.5"/>
    </g>
  </defs>

