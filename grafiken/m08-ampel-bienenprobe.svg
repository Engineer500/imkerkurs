<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="m08-ab-titel m08-ab-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="320" fill="#ffffff"/>
  <title id="m08-ab-titel">Die Ampel für die Bienenprobe im Juli und im September</title>
  <desc id="m08-ab-beschr">Zwei waagerechte Skalen für die Bienenprobe mit 50 g. Anfang Juli: Grün unter 1 Prozent, Gelb 1 bis 5 Prozent, Rot über 5 Prozent. September, mindestens 14 Tage nach Maßnahmenende: Grün unter 2 Prozent, Gelb 2 bis 5 Prozent, Rot über 5 Prozent.</desc>

  <defs>
    <!-- Grün: Punkte -->
    <pattern id="m08-ab-punkte" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.9" fill="#ffffff" fill-opacity=".6"/>
    </pattern>
    <!-- Gelb: Schrägstriche -->
    <pattern id="m08-ab-schraeg" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a2a10" stroke-width="1.6" stroke-opacity=".4"/>
    </pattern>
    <!-- Rot: Kreuzschraffur -->
    <pattern id="m08-ab-kreuz" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0L8 8M8 0L0 8" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-opacity=".5"/>
    </pattern>
  </defs>

  <!-- Oberer Balken: Anfang Juli, Grenzen bei 1 und 5 Prozent (1 Prozent = 42,5, Nullpunkt bei x = 20) -->
  <rect x="20" y="62" width="42.5" height="36" fill="#5b8c3a"/>
  <rect x="20" y="62" width="42.5" height="36" fill="url(#m08-ab-punkte)"/>
  <rect x="62.5" y="62" width="170" height="36" fill="#e0b020"/>
  <rect x="62.5" y="62" width="170" height="36" fill="url(#m08-ab-schraeg)"/>
  <rect x="232.5" y="62" width="127.5" height="36" fill="#b8322a"/>
  <rect x="232.5" y="62" width="127.5" height="36" fill="url(#m08-ab-kreuz)"/>
  <path d="M360 56L386 80L360 104Z" fill="#b8322a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M360 56L386 80L360 104Z" fill="url(#m08-ab-kreuz)"/>
  <rect x="20" y="62" width="340" height="36" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M62.5 62V98M232.5 62V98" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Dünne senkrechte Linien bei 1 und bei 2 Prozent im oberen Balken -->
  <g stroke="#3a2a10" stroke-width="1" fill="none">
    <path d="M62.5 58V106M105 58V106"/>
  </g>

  <!-- Haltelinien von den Bereichen zu den Texten, oberer Balken -->
  <g stroke="#3a2a10" stroke-width="1">
    <line x1="41" y1="98" x2="41" y2="113"/>
    <line x1="147.5" y1="98" x2="147.5" y2="113"/>
    <line x1="296.3" y1="98" x2="296.3" y2="113"/>
  </g>
  <g fill="#3a2a10">
    <circle cx="41" cy="98" r="2.3"/>
    <circle cx="147.5" cy="98" r="2.3"/>
    <circle cx="296.3" cy="98" r="2.3"/>
  </g>

  <!-- Unterer Teil um 20 Einheiten nach unten verschoben, damit unter "September" eine Zeile Platz hat -->
  <g transform="translate(0 20)">
    <!-- Unterer Balken: September, Grenzen bei 2 und 5 Prozent -->
    <rect x="20" y="194" width="85" height="36" fill="#5b8c3a"/>
    <rect x="20" y="194" width="85" height="36" fill="url(#m08-ab-punkte)"/>
    <rect x="105" y="194" width="127.5" height="36" fill="#e0b020"/>
    <rect x="105" y="194" width="127.5" height="36" fill="url(#m08-ab-schraeg)"/>
    <rect x="232.5" y="194" width="127.5" height="36" fill="#b8322a"/>
    <rect x="232.5" y="194" width="127.5" height="36" fill="url(#m08-ab-kreuz)"/>
    <path d="M360 188L386 212L360 236Z" fill="#b8322a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M360 188L386 212L360 236Z" fill="url(#m08-ab-kreuz)"/>
    <rect x="20" y="194" width="340" height="36" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
    <path d="M105 194V230M232.5 194V230" stroke="#3a2a10" stroke-width="1.5"/>

    <!-- Dünne senkrechte Linien bei 1 und bei 2 Prozent im unteren Balken -->
    <g stroke="#3a2a10" stroke-width="1" fill="none">
      <path d="M62.5 190V238M105 190V238"/>
    </g>

    <!-- Haltelinien von den Bereichen zu den Texten, unterer Balken -->
    <g stroke="#3a2a10" stroke-width="1">
      <line x1="41" y1="230" x2="41" y2="245"/>
      <line x1="168.8" y1="230" x2="168.8" y2="245"/>
      <line x1="296.3" y1="230" x2="296.3" y2="245"/>
    </g>
    <g fill="#3a2a10">
      <circle cx="41" cy="230" r="2.3"/>
      <circle cx="168.8" cy="230" r="2.3"/>
      <circle cx="296.3" cy="230" r="2.3"/>
    </g>

    <g fill="#1f1a12" font-size="16">
      <g font-weight="700">
        <text x="20" y="264">Grün:</text>
        <text x="168.8" y="264" text-anchor="middle">Gelb:</text>
        <text x="296.3" y="264" text-anchor="middle">Rot:</text>
      </g>
      <text x="20" y="284">unter 2 %</text>
      <text x="168.8" y="284" text-anchor="middle">2 bis 5 %</text>
      <text x="296.3" y="284" text-anchor="middle">über 5 %</text>
    </g>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="200" y="24" text-anchor="middle" font-weight="700">Bienenprobe mit 50 g, Befall in Prozent</text>
    <text x="20" y="50" font-weight="700">Anfang Juli</text>
    <text x="20" y="182" font-weight="700">September</text>
    <text x="20" y="202" font-size="14">mindestens 14 Tage nach Maßnahmenende</text>
    <g font-weight="700">
      <text x="20" y="132">Grün:</text>
      <text x="147.5" y="132" text-anchor="middle">Gelb:</text>
      <text x="296.3" y="132" text-anchor="middle">Rot:</text>
    </g>
    <text x="20" y="152">unter 1 %</text>
    <text x="147.5" y="152" text-anchor="middle">1 bis 5 %</text>
    <text x="296.3" y="152" text-anchor="middle">über 5 %</text>
  </g>
</svg>
