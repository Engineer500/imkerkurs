    <path id="m01-wa-brut-form" d="M288.2 134C289.4 141.2 287.9 150.1 283.7 156.7C279.6 163.2 270.6 168.6 263.4 173.3C256.2 178 248.5 181.5 240.6 185C232.7 188.5 224.7 192.8 215.9 194.3C207.2 195.8 196.8 195.5 188.1 193.9C179.5 192.2 171.4 188 163.8 184.4C156.3 180.7 148.8 176.9 142.7 171.9C136.6 167 130.5 161.1 127.3 154.7C124 148.4 123.6 141 123.3 134C122.9 127 123.5 119.9 125.4 112.7C127.3 105.6 129.1 96.9 134.7 90.9C140.2 84.9 149.7 79.4 158.7 76.8C167.7 74.3 179.2 75.4 188.5 75.8C197.9 76.2 206.2 77.7 214.7 79.1C223.2 80.6 231.8 81.6 239.5 84.5C247.1 87.4 254.3 91.8 260.5 96.6C266.7 101.4 272.2 107 276.8 113.2C281.4 119.5 287.1 126.8 288.2 134Z"/>
