  <rect width="400" height="267" fill="#ffffff"/>
  <title id="m01-wa-titel">Aufbau einer Wabe im Brutnest</title>
  <desc id="m01-wa-beschr">Wabe von der Seite: In der Mitte liegt die Brut bei 34 bis 36 °C, darum ein Kranz aus Pollen, außen der breite Honigkranz.</desc>

  <defs>
