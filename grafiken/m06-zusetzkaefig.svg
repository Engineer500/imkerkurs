<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" role="img" aria-labelledby="m06-zk-titel m06-zk-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="456" fill="#ffffff"/>
  <title id="m06-zk-titel">Zusetzen im Käfig</title>
  <desc id="m06-zk-beschr">Zeitstrahl mit Käfig. Tag 0: alte Königin entnehmen. Tag 9: Nachschaffungszellen brechen und die Königin im Käfig zusetzen. Danach bis zu 3 Tage im Käfig. Etwa Tag 16: Kontrolle, 7 Tage nach dem Zusetzen. Unten ein schräg hängender Zusetzkäfig im Schnitt mit Königin, Gitter und Futterteigverschluss, der zwischen zwei Brutwaben hängt.</desc>

  <defs>
    <!-- Deckelmuster der Brutwaben (wie in m04-kurzdurchsicht.svg) -->
    <pattern id="m06-zk-deckel" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.200" fill="none" stroke="#3a2a10" stroke-width=".9" stroke-opacity=".45"/>
    </pattern>

    <!-- BIENENFORM: Königin mit kleiner Krone (wie in m01-schwarmzelle.svg), Seitenansicht, Blick nach rechts -->
    <g id="biene-koenigin">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-9.3" cy="-9.9" rx="10.5" ry="4.6" transform="rotate(28 -9.3 -9.9)"/>
        <ellipse cx="-5.5" cy="-12.8" rx="9.5" ry="4.2" transform="rotate(55 -5.5 -12.8)"/>
      </g>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-17.5" cy="2" rx="17.5" ry="7.2" fill="#f2c14e"/>
        <path d="M-15 -5.13A17.5 7.2 0 0 1 -12 -4.84L-12 8.84A17.5 7.2 0 0 1 -15 9.13ZM-21.5 -5.01A17.5 7.2 0 0 1 -18.5 -5.19L-18.5 9.19A17.5 7.2 0 0 1 -21.5 9.01ZM-28 -3.76A17.5 7.2 0 0 1 -25 -4.51L-25 8.51A17.5 7.2 0 0 1 -28 7.76Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
      <path d="M5.5 -4.5L6.500 -12L9.500 -8.500L12.500 -13.500L15.500 -8.500L18.500 -12L19.500 -4.500Z" fill="#f2c14e" stroke="#3a2a10" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ===== Zeitstrahl: 20 Einheiten je Tag, Tag 0 bei x=40 ===== -->
  <!-- Tagesmarken -->
  <path d="M60 136V144M80 136V144M100 136V144M120 136V144M140 136V144M160 136V144M180 136V144M200 136V144M240 136V144M260 136V144M300 136V144M320 136V144M340 136V144" fill="none" stroke="#3a2a10" stroke-opacity=".5" stroke-width="1"/>
  <line x1="40" y1="140" x2="372" y2="140" stroke="#3a2a10" stroke-width="2.500"/>
  <path d="M372 132L388 140L372 148Z" fill="#3a2a10"/>
  <!-- Zeit im Käfig: Tag 9 bis Tag 12 -->
  <line x1="220" y1="140" x2="280" y2="140" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <!-- Marken: Tag 0, Tag 9, Tag 16 gefüllt, Tag 12 offen -->
  <circle cx="40" cy="140" r="6.500" fill="#3a2a10"/>
  <circle cx="220" cy="140" r="6.500" fill="#3a2a10"/>
  <circle cx="280" cy="140" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <circle cx="360" cy="140" r="6.500" fill="#3a2a10"/>

  <!-- Klammer über dem Strahl für die Zeit im Käfig -->
  <path d="M220 128V124Q220 120 224 120H246Q250 120 250 116Q250 120 254 120H276Q280 120 280 124V128" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Linie von Tag 16 zum Textblock -->
  <line x1="360" y1="80" x2="360" y2="133" stroke="#3a2a10" stroke-width="1"/>

  <!-- Textblöcke abwechselnd über und unter dem Strahl -->
  <g fill="#1f1a12" font-size="16">
    <text x="24" y="78" font-weight="700">Tag 0:</text>
    <text x="24" y="100">alte Königin</text>
    <text x="24" y="122">entnehmen</text>

    <text x="250" y="104" text-anchor="middle">bis zu 3 Tage im Käfig</text>

    <text x="392" y="30" text-anchor="end" font-weight="700">etwa Tag 16:</text>
    <text x="392" y="52" text-anchor="end">Kontrolle, 7 Tage</text>
    <text x="392" y="74" text-anchor="end">nach dem Zusetzen</text>

    <text x="220" y="172" text-anchor="middle" font-weight="700">Tag 9:</text>
    <text x="220" y="194" text-anchor="middle">Zellen brechen,</text>
    <text x="220" y="216" text-anchor="middle">Königin im Käfig</text>
    <text x="220" y="238" text-anchor="middle">zusetzen</text>
  </g>

  <!-- Trennlinie zwischen Zeitstrahl und Schnitt -->
  <line x1="10" y1="252" x2="390" y2="252" stroke="#3a2a10" stroke-opacity=".25" stroke-width="1"/>

  <!-- ===== Zusetzkäfig im Schnitt zwischen zwei Brutwaben ===== -->
  <g transform="translate(0 6)">
  <!-- Oberträger und Brutwaben, links und rechts -->
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5">
    <rect x="36" y="272" width="68" height="6"/>
    <rect x="296" y="272" width="68" height="6"/>
  </g>
  <rect x="40" y="278" width="60" height="138" fill="#d9a441"/>
  <rect x="40" y="278" width="60" height="138" fill="url(#m06-zk-deckel)" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="300" y="278" width="60" height="138" fill="#d9a441"/>
  <rect x="300" y="278" width="60" height="138" fill="url(#m06-zk-deckel)" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Käfig: leicht schräg, der Futterteigverschluss liegt tiefer als die Königin; Stirnwände aus Holz, oben und unten Gitter als gepunktete Linie -->
  <g transform="rotate(8 200 351)">
  <rect x="106" y="326" width="188" height="50" fill="#ffffff"/>
  <rect x="100" y="326" width="6" height="50" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="294" y="326" width="6" height="50" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M106 326H294M106 376H294" fill="none" stroke="#3a2a10" stroke-width="2.500" stroke-dasharray="0.1 4.500" stroke-linecap="round"/>
  <!-- Futterteigverschluss: heller Block rechts im Käfig -->
  <rect x="238" y="330" width="56" height="42" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M248 342H262M270 350H284M250 360H266" fill="none" stroke="#3a2a10" stroke-opacity=".35" stroke-width="1.500" stroke-linecap="round"/>
  <!-- Königin mit Krone, links im Käfig -->
  <use href="#biene-koenigin" transform="translate(150 353)"/>
  </g>

  <!-- Linien zu den Beschriftungen -->
  <g stroke="#3a2a10" stroke-width="1" stroke-linecap="round">
    <line x1="203" y1="304" x2="203" y2="326"/>
    <line x1="150" y1="392" x2="150" y2="358"/>
    <line x1="262" y1="422" x2="262" y2="380"/>
  </g>
  <g fill="#3a2a10">
    <circle cx="203" cy="326" r="2.300"/>
    <circle cx="150" cy="358" r="2.300"/>
    <circle cx="262" cy="380" r="2.300"/>
  </g>

  <!-- Beschriftungen unten -->
  <g fill="#1f1a12" font-size="16">
    <text x="70" y="264" text-anchor="middle">Brutwabe</text>
    <text x="330" y="264" text-anchor="middle">Brutwabe</text>
    <text x="200" y="298" text-anchor="middle">Gitter</text>
    <text x="150" y="408" text-anchor="middle">Königin</text>
    <text x="296" y="438" text-anchor="end">Futterteigverschluss</text>
  </g>
  </g>
</svg>
