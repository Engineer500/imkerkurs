<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="m11-bs-titel m11-bs-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="330" fill="#ffffff"/>
  <title id="m11-bs-titel">Totale Brutentnahme als imitierter Schwarm</title>
  <desc id="m11-bs-beschr">Drei Zustände einer Zarge von oben. Vorher: zwischen zwei Schieden sieben Brutwaben mit Schwarmzellen und das Drohnenrähmchen am Rand. Tag 0: Die Brutwaben sind entnommen, vier Rähmchen mit Mittelwänden hängen zwischen den Schieden. Nach einer Woche: Drei verdeckelte Waben ohne Weiselzellen sind zurückgehängt.</desc>

  <defs>
    <!-- Zellmuster: regelmäßige Sechsecke mit senkrechten Seitenwänden, waagrecht versetzte Reihen -->
    <pattern id="m11-bs-zellen" width="7.500" height="12.990" patternUnits="userSpaceOnUse">
      <path d="M0 2.165L3.750 0L7.500 2.165V6.495L3.750 8.660L0 6.495ZM3.750 8.660V12.990" fill="none" stroke="#3a2a10" stroke-width=".9" stroke-opacity=".55"/>
    </pattern>
    <!-- Schraffur des Schieds -->
    <pattern id="m11-bs-schraeg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#d8d2c4"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#3a2a10" stroke-width="1.500" stroke-opacity=".75"/>
    </pattern>
    <!-- Feine senkrechte Linien der Mittelwand, ohne Zellmuster -->
    <pattern id="m11-bs-mw" width="3" height="6" patternUnits="userSpaceOnUse">
      <line x1="1.500" y1="0" x2="1.500" y2="6" stroke="#3a2a10" stroke-width=".8" stroke-opacity=".5"/>
    </pattern>

    <!-- Punktmuster des Drohnenrähmchens -->
    <pattern id="m11-bs-punkte" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.500" cy="2.500" r="1.100" fill="#3a2a10" fill-opacity=".7"/>
    </pattern>

    <!-- Ein Platz, Ursprung links oben, 30 breit und 44 hoch -->
    <g id="m11-bs-schied">
      <rect x="7.500" y="0" width="15" height="44" fill="url(#m11-bs-schraeg)" stroke="#3a2a10" stroke-width="1.200"/>
    </g>
    <g id="m11-bs-brut">
      <rect width="30" height="44" fill="#d9a441"/>
      <rect width="30" height="44" fill="url(#m11-bs-zellen)" stroke="#3a2a10" stroke-width="1.500"/>
    </g>
    <g id="m11-bs-mittelwand">
      <rect width="30" height="44" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.500"/>
      <rect x="4" y="4" width="22" height="36" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
      <rect x="4" y="4" width="22" height="36" fill="url(#m11-bs-mw)"/>
    </g>
    <g id="m11-bs-drohne">
      <rect width="30" height="44" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.500"/>
      <rect x="4" y="4" width="22" height="36" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
      <rect x="4" y="4" width="22" height="36" fill="url(#m11-bs-punkte)"/>
    </g>
    <g id="m11-bs-frei">
      <rect width="30" height="44" fill="none" stroke="#3a2a10" stroke-width="1" stroke-opacity=".7" stroke-dasharray="4 3"/>
    </g>

    <!-- BIENENFORM: Königin mit kleiner Krone (wie in m06-zusetzkaefig.svg), Seitenansicht, Blick nach rechts -->
    <g id="m11-bs-koenigin">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.100">
        <ellipse cx="-9.300" cy="-9.900" rx="10.500" ry="4.600" transform="rotate(28 -9.300 -9.900)"/>
        <ellipse cx="-5.500" cy="-12.800" rx="9.500" ry="4.200" transform="rotate(55 -5.500 -12.800)"/>
      </g>
      <path d="M-3 6.500L-6 12.500M1 7.200L1.500 13.500M4.500 6.500L8.500 11.500" fill="none" stroke="#3a2a10" stroke-width="1.200" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.500">
        <ellipse cx="-17.500" cy="2" rx="17.500" ry="7.200" fill="#f2c14e"/>
        <path d="M-15 -5.130A17.500 7.200 0 0 1 -12 -4.840L-12 8.840A17.500 7.200 0 0 1 -15 9.130ZM-21.500 -5.010A17.500 7.200 0 0 1 -18.500 -5.190L-18.500 9.190A17.500 7.200 0 0 1 -21.500 9.010ZM-28 -3.760A17.500 7.200 0 0 1 -25 -4.510L-25 8.510A17.500 7.200 0 0 1 -28 7.760Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.800" ry="7.200" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.500 -9M14.500 -1.500L21 -5.500" fill="none" stroke="#3a2a10" stroke-width="1.200" stroke-linecap="round"/>
      <ellipse cx="10.600" cy="0.600" rx="5" ry="4.800" fill="#3a2a10"/>
      <circle cx="12.200" cy="-0.800" r="1.300" fill="#ffffff"/>
      <path d="M5.500 -4.500L6.500 -12L9.500 -8.500L12.500 -13.500L15.500 -8.500L18.500 -12L19.500 -4.500Z" fill="#f2c14e" stroke="#3a2a10" stroke-width="1.200" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Überschriften der Zeilen -->
  <g fill="#1f1a12" font-size="18" font-weight="700">
    <text x="20" y="18">Vorher</text>
    <text x="20" y="134">Tag 0</text>
    <text x="20" y="242">nach einer Woche</text>
  </g>

  <!-- ===== Vorher: Schied, sieben Brutwaben mit Schwarmzellen, Drohnenrähmchen, Schied ===== -->
  <rect x="16" y="24" width="344" height="52" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.500"/>
  <use href="#m11-bs-schied" x="20" y="28"/>
  <use href="#m11-bs-brut" x="54" y="28"/>
  <use href="#m11-bs-brut" x="88" y="28"/>
  <use href="#m11-bs-brut" x="122" y="28"/>
  <use href="#m11-bs-brut" x="156" y="28"/>
  <use href="#m11-bs-brut" x="190" y="28"/>
  <use href="#m11-bs-brut" x="224" y="28"/>
  <use href="#m11-bs-brut" x="258" y="28"/>
  <use href="#m11-bs-drohne" x="292" y="28"/>
  <use href="#m11-bs-schied" x="326" y="28"/>
  <!-- Schwarmzellen als kleine Dreiecke an der Unterkante der Brutwaben -->
  <g fill="#b45309" stroke="#3a2a10" stroke-width=".8" stroke-linejoin="round">
    <path d="M58.500 64H67.500L63 72Z"/>
    <path d="M104.500 64H113.500L109 72Z"/>
    <path d="M126.500 64H135.500L131 72Z"/>
    <path d="M172.500 64H181.500L177 72Z"/>
    <path d="M194.500 64H203.500L199 72Z"/>
    <path d="M240.500 64H249.500L245 72Z"/>
    <path d="M262.500 64H271.500L267 72Z"/>
  </g>

  <!-- Pfeil: alle sieben Brutwaben und das Drohnenrähmchen in die Wabenkiste -->
  <path d="M273 78V126" fill="none" stroke="#b45309" stroke-width="2.500"/>
  <path d="M273 135L267.500 125H278.500Z" fill="#b45309" stroke="#b45309" stroke-width="1" stroke-linejoin="round"/>

  <!-- ===== Tag 0: Schied, vier Rähmchen mit Mittelwand, Schied; daneben die Wabenkiste ===== -->
  <rect x="16" y="140" width="208" height="52" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.500"/>
  <use href="#m11-bs-schied" x="20" y="144"/>
  <use href="#m11-bs-mittelwand" x="54" y="144"/>
  <use href="#m11-bs-mittelwand" x="88" y="144"/>
  <use href="#m11-bs-mittelwand" x="122" y="144"/>
  <use href="#m11-bs-mittelwand" x="156" y="144"/>
  <use href="#m11-bs-schied" x="190" y="144"/>
  <!-- Die Königin bleibt im Volk -->
  <use href="#m11-bs-koenigin" transform="translate(139 168) scale(.55)"/>

  <!-- Wabenkiste mit den sieben Brutwaben und dem Drohnenrähmchen (rechts) -->
  <rect x="232" y="136" width="144" height="60" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.500"/>
  <rect x="238" y="142" width="132" height="48" fill="#fffaf0" stroke="#3a2a10" stroke-width="1"/>
  <g fill="#d9a441">
    <rect x="241.500" y="146" width="11.500" height="40"/>
    <rect x="257.700" y="146" width="11.500" height="40"/>
    <rect x="273.900" y="146" width="11.500" height="40"/>
    <rect x="290.100" y="146" width="11.500" height="40"/>
    <rect x="306.300" y="146" width="11.500" height="40"/>
    <rect x="322.500" y="146" width="11.500" height="40"/>
    <rect x="338.700" y="146" width="11.500" height="40"/>
  </g>
  <g fill="url(#m11-bs-zellen)" stroke="#3a2a10" stroke-width="1.200">
    <rect x="241.500" y="146" width="11.500" height="40"/>
    <rect x="257.700" y="146" width="11.500" height="40"/>
    <rect x="273.900" y="146" width="11.500" height="40"/>
    <rect x="290.100" y="146" width="11.500" height="40"/>
    <rect x="306.300" y="146" width="11.500" height="40"/>
    <rect x="322.500" y="146" width="11.500" height="40"/>
    <rect x="338.700" y="146" width="11.500" height="40"/>
  </g>
  <rect x="354.900" y="146" width="11.500" height="40" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.200"/>
  <rect x="354.900" y="146" width="11.500" height="40" fill="url(#m11-bs-punkte)"/>

  <!-- Pfeil von der Wabenkiste auf die drei zurückgehängten Waben -->
  <path d="M240 198V222" fill="none" stroke="#b45309" stroke-width="2.500"/>
  <path d="M240 229L234.500 221H245.500Z" fill="#b45309" stroke="#b45309" stroke-width="1" stroke-linejoin="round"/>
  <!-- Klammer über den drei Waben -->
  <path d="M191 242Q191 236 199 236H232Q240 236 240 230Q240 236 248 236H281Q289 236 289 242" fill="none" stroke="#3a2a10" stroke-width="1.500" stroke-linecap="round"/>

  <!-- ===== Nach einer Woche: Schied, vier Rähmchen mit Mittelwand, drei verdeckelte Waben, Schied ===== -->
  <rect x="16" y="248" width="344" height="52" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.500"/>
  <use href="#m11-bs-schied" x="20" y="252"/>
  <use href="#m11-bs-mittelwand" x="54" y="252"/>
  <use href="#m11-bs-mittelwand" x="88" y="252"/>
  <use href="#m11-bs-mittelwand" x="122" y="252"/>
  <use href="#m11-bs-mittelwand" x="156" y="252"/>
  <use href="#m11-bs-brut" x="190" y="252"/>
  <use href="#m11-bs-brut" x="224" y="252"/>
  <use href="#m11-bs-brut" x="258" y="252"/>
  <use href="#m11-bs-schied" x="292" y="252"/>
  <use href="#m11-bs-frei" x="326" y="252"/>

  <!-- Linien zu den Beschriftungen -->
  <g fill="none" stroke="#3a2a10" stroke-width="1">
    <path d="M307 22V34"/>
    <path d="M63 92V68"/>
    <path d="M137 138V155"/>
    <path d="M69 198V183"/>
    <path d="M239 308V290"/>
  </g>
  <g fill="#3a2a10">
    <circle cx="307" cy="34" r="2.500"/>
    <circle cx="63" cy="68" r="2.500"/>
    <circle cx="137" cy="155" r="2.500"/>
    <circle cx="69" cy="183" r="2.500"/>
    <circle cx="239" cy="290" r="2.500"/>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="380" y="18" text-anchor="end">Drohnenrähmchen</text>
    <text x="20" y="104">Schwarmzellen</text>
    <text x="286" y="108">Wabenkiste</text>
    <text x="84" y="134">Königin bleibt</text>
    <text x="20" y="214">Mittelwand</text>
    <text x="239" y="324" text-anchor="middle">drei verdeckelte Waben</text>
  </g>
</svg>
