<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 408" role="img" aria-labelledby="m08-bz-titel m08-bz-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="408" fill="#ffffff"/>
  <title id="m08-bz-titel">Brutentnahme und Käfigen auf einer Zeitachse</title>
  <desc id="m08-bz-beschr">Zeitachse mit Tag 0, Tag 9 und Tag 25. Totale Brutentnahme: an Tag 0 Brutwaben heraus und eine Brutwabe als Fangwabe bleibt, an Tag 9 Fangwabe heraus. Käfigen: an Tag 0 Königin käfigen, an Tag 9 Zellen brechen, falls vorhanden, an Tag 25 Königin frei und Oxalsäure sprühen.</desc>

  <defs>
    <!-- Sechseckstruktur der Waben (wie in m01-wabe-aufbau.svg) -->
    <pattern id="m08-bz-sechseck" width="12.124" height="21" patternUnits="userSpaceOnUse">
      <path d="M0 3.5L6.062 0L12.124 3.5V10.5L6.062 14L0 10.5ZM6.062 14V21" fill="none" stroke="#3a2a10" stroke-width=".9" stroke-opacity=".45"/>
    </pattern>
    <!-- Gittermuster für die Zeit mit gekäfigter Königin -->
    <pattern id="m08-bz-gitter" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H6M0 0V6" fill="none" stroke="#3a2a10" stroke-width="1" stroke-opacity=".6"/>
    </pattern>

    <!-- Ereignispfeil nach unten: Linie mit Spitze, Ursprung am Beginn der Linie -->
    <g id="m08-bz-ereignis">
      <path d="M0 0V13" fill="none" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M-5.5 11L0 19L5.5 11Z" fill="#b45309"/>
    </g>
    <!-- Pfeil nach rechts für heraus und hinein -->
    <g id="m08-bz-pfeil">
      <path d="M0 0H10" fill="none" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M9 -5.5L17 0L9 5.5Z" fill="#b45309"/>
    </g>

    <!-- Brutwabe von der Seite: dunkle, verdeckelte Zellen, Ursprung in der Mitte -->
    <g id="m08-bz-brutwabe">
      <rect x="-12" y="-13" width="24" height="26" rx="2" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
      <rect x="-9" y="-10" width="18" height="20" fill="#d9a441"/>
      <rect x="-9" y="-10" width="18" height="20" fill="url(#m08-bz-sechseck)"/>
      <rect x="-9" y="-10" width="18" height="20" fill="none" stroke="#3a2a10" stroke-width="1"/>
    </g>
    <!-- Fangwabe: helle, offene Zellen -->
    <g id="m08-bz-fangwabe">
      <rect x="-12" y="-13" width="24" height="26" rx="2" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
      <rect x="-9" y="-10" width="18" height="20" fill="#fff4d6"/>
      <rect x="-9" y="-10" width="18" height="20" fill="url(#m08-bz-sechseck)"/>
      <rect x="-9" y="-10" width="18" height="20" fill="none" stroke="#3a2a10" stroke-width="1"/>
    </g>

    <!-- Käfig mit Königin -->
    <g id="m08-bz-kaefig">
      <rect x="-13" y="-13" width="26" height="26" rx="7" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.5"/>
      <path d="M-8 -12V12M-4 -12V12M0 -12V12M4 -12V12M8 -12V12" fill="none" stroke="#3a2a10" stroke-width="1" stroke-opacity=".55"/>
      <ellipse cx="-1" cy="0" rx="8" ry="3.2" fill="#f2c14e" stroke="#3a2a10" stroke-width="1"/>
      <circle cx="8" cy="0" r="2.6" fill="#3a2a10"/>
    </g>
    <!-- Weiselzelle mit Kreuz -->
    <g id="m08-bz-weiselzelle">
      <path d="M0 -14C6 -14 8 -7 6 -1C9 5 6 14 0 15C-6 14 -9 5 -6 -1C-8 -7 -6 -14 0 -14Z" fill="#d9a441" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M-5 -6H5M-6 1H6M-5 8H5" fill="none" stroke="#3a2a10" stroke-width="1" stroke-opacity=".5"/>
      <path d="M-10 -10L10 10M10 -10L-10 10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M-10 -10L10 10M10 -10L-10 10" fill="none" stroke="#b8322a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- BIENENFORM: Königin. Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust (wie in m01) -->
    <g id="m08-bz-koenigin">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-9.3" cy="-9.9" rx="10.5" ry="4.6" transform="rotate(28 -9.3 -9.9)"/>
        <ellipse cx="-5.5" cy="-12.8" rx="9.5" ry="4.2" transform="rotate(55 -5.5 -12.8)"/>
      </g>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-17.5" cy="2" rx="17.5" ry="7.2" fill="#f2c14e"/>
        <path d="M-15 -5.13A17.5 7.2 0 0 1 -12 -4.84L-12 8.84A17.5 7.2 0 0 1 -15 9.13ZM-21.5 -5.01A17.5 7.2 0 0 1 -18.5 -5.19L-18.5 9.19A17.5 7.2 0 0 1 -21.5 9.01ZM-28 -3.76A17.5 7.2 0 0 1 -25 -4.51L-25 8.51A17.5 7.2 0 0 1 -28 7.76Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Gestrichelte Hilfslinien von der Zeitachse zu den Spuren, hinter allem -->
  <g stroke="#3a2a10" stroke-width="1" stroke-opacity=".55" stroke-dasharray="2 4" fill="none">
    <path d="M26 46V90M148.4 46V90"/>
    <path d="M366 46V274"/>
    <path d="M26 246V274M148.4 246V274"/>
  </g>

  <!-- Zeitachse oben: Tag 0 bis Tag 25 über 340 Einheiten (1 Tag = 13,6) -->
  <path d="M26 40H366" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
  <g stroke="#3a2a10" stroke-width="1.5">
    <line x1="26" y1="33" x2="26" y2="47"/>
    <line x1="148.4" y1="33" x2="148.4" y2="47"/>
    <line x1="366" y1="33" x2="366" y2="47"/>
  </g>

  <!-- dünne Trennlinien zwischen den Spuren -->
  <g stroke="#3a2a10" stroke-width="1" stroke-opacity=".5">
    <line x1="8" y1="56" x2="392" y2="56"/>
    <line x1="8" y1="244" x2="392" y2="244"/>
  </g>

  <!-- Schilder hinter den Spurtiteln -->
  <g fill="#ffffff">
    <rect x="8" y="61" width="186" height="22"/>
    <rect x="8" y="249" width="70" height="22"/>
  </g>

  <!-- Spur 1: totale Brutentnahme, dünner Balken zwischen Tag 0 und Tag 9 -->
  <rect x="26" y="89" width="122.4" height="6" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.2"/>
  <g fill="#b45309" stroke="#3a2a10" stroke-width="1.2">
    <circle cx="26" cy="92" r="5.5"/>
    <circle cx="148.4" cy="92" r="5.5"/>
  </g>
  <use href="#m08-bz-ereignis" x="26" y="99"/>
  <use href="#m08-bz-ereignis" x="148.4" y="99"/>
  <!-- Tag 0: Brutwabe heraus, eine Fangwabe bleibt im Volk -->
  <use href="#m08-bz-brutwabe" x="26" y="132"/>
  <use href="#m08-bz-pfeil" x="40" y="132"/>
  <use href="#m08-bz-fangwabe" x="95" y="132"/>
  <!-- Tag 9: Fangwabe heraus -->
  <use href="#m08-bz-fangwabe" x="148.4" y="132"/>
  <use href="#m08-bz-pfeil" x="162.4" y="132"/>

  <!-- Spur 2: Käfigen, durchgehender Balken mit Gittermuster von Tag 0 bis Tag 25 -->
  <rect x="26" y="274" width="340" height="14" fill="#fff4d6"/>
  <rect x="26" y="274" width="340" height="14" fill="url(#m08-bz-gitter)"/>
  <rect x="26" y="274" width="340" height="14" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
  <g fill="#b45309" stroke="#3a2a10" stroke-width="1.2">
    <circle cx="26" cy="281" r="6"/>
    <circle cx="148.4" cy="281" r="6"/>
    <circle cx="366" cy="281" r="6"/>
  </g>
  <use href="#m08-bz-ereignis" x="26" y="289"/>
  <use href="#m08-bz-ereignis" x="148.4" y="289"/>
  <use href="#m08-bz-ereignis" x="366" y="289"/>
  <use href="#m08-bz-kaefig" x="26" y="322"/>
  <use href="#m08-bz-weiselzelle" x="148.4" y="322"/>
  <!-- Tag 25: Königin frei, Sprühflasche -->
  <use href="#m08-bz-koenigin" transform="translate(333 326) scale(.62)"/>
  <g stroke="#3a2a10" stroke-width="1.2">
    <rect x="367" y="319" width="17" height="22" rx="3" fill="#4a7fb5" fill-opacity=".35"/>
    <rect x="371" y="312" width="9" height="7" fill="#b8bcc2"/>
    <rect x="364" y="306" width="20" height="7" rx="2" fill="#b8bcc2"/>
    <rect x="360" y="308" width="4" height="3" fill="#3a2a10"/>
  </g>
  <g fill="#4a7fb5">
    <circle cx="355" cy="308" r="1.7"/>
    <circle cx="350.5" cy="312" r="1.7"/>
    <circle cx="356" cy="315" r="1.7"/>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="26" y="24">Tag 0</text>
    <g text-anchor="middle">
      <text x="148.4" y="24">Tag 9</text>
      <text x="366" y="24">Tag 25</text>
    </g>
    <g font-weight="700">
      <text x="14" y="78">Totale Brutentnahme</text>
      <text x="14" y="266">Käfigen</text>
    </g>
    <!-- Spur 1 -->
    <text x="14" y="158">Brutwaben</text>
    <text x="14" y="176">heraus,</text>
    <text x="14" y="194">eine Brutwabe</text>
    <text x="14" y="212">als Fangwabe</text>
    <text x="14" y="230">bleibt</text>
    <g text-anchor="middle">
      <text x="148.4" y="158">Fangwabe</text>
      <text x="148.4" y="176">heraus</text>
    </g>
    <!-- Spur 2 -->
    <text x="14" y="358">Königin</text>
    <text x="14" y="377">käfigen</text>
    <g text-anchor="middle">
      <text x="148.4" y="358">Zellen brechen,</text>
      <text x="148.4" y="377">falls vorhanden</text>
    </g>
    <g text-anchor="end">
      <text x="392" y="358">Königin frei,</text>
      <text x="392" y="377">Oxalsäure</text>
      <text x="392" y="396">sprühen</text>
    </g>
  </g>
</svg>
