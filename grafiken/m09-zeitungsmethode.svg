<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" role="img" aria-labelledby="m09-zm-titel m09-zm-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="296" fill="#ffffff"/>
  <title id="m09-zm-titel">Die Zeitungsmethode im Schnitt</title>
  <desc id="m09-zm-beschr">Schnitt durch zwei übereinanderstehende Beuten. Unten sitzt das aufnehmende Volk, dessen Königin bleibt. Darüber liegt ein leicht befeuchtetes Zeitungsblatt mit kurzen Schnitten. Obenauf sitzt das aufgesetzte Volk, dessen Königin entnommen wurde.</desc>

  <defs>
    <!-- BIENENFORM: Königin. Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust, länger und schlanker als die Arbeiterin, Punkt auf dem Rücken. -->
    <g id="m09-zm-koenigin">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-9.3" cy="-9.9" rx="10.5" ry="4.6" transform="rotate(28 -9.3 -9.9)"/>
        <ellipse cx="-5.5" cy="-12.8" rx="9.5" ry="4.2" transform="rotate(55 -5.5 -12.8)"/>
      </g>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-17.5" cy="2" rx="17.5" ry="7.2" fill="#f2c14e"/>
        <path d="M-15 -5.13A17.5 7.2 0 0 1 -12 -4.84L-12 8.84A17.5 7.2 0 0 1 -15 9.13ZM-21.5 -5.01A17.5 7.2 0 0 1 -18.5 -5.19L-18.5 9.19A17.5 7.2 0 0 1 -21.5 9.01ZM-28 -3.76A17.5 7.2 0 0 1 -25 -4.51L-25 8.51A17.5 7.2 0 0 1 -28 7.76Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <circle cx="-1" cy="-1" r="2.8" fill="#b45309" stroke="#ffffff" stroke-width="1"/>
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
    </g>
    <!-- Umriss der Königin ohne Fläche, für den gestrichelten Umriss und als weißer Hof -->
    <path id="m09-zm-umriss" d="M-35 2C-35 -2.5-27 -5.2-17.5 -5.2C-12 -5.2-9 -4.5-7.5 -3.6C-5 -6.5-2 -7.2 0 -7.2C3 -7.2 5.5 -6 7 -4.6C8.5 -4.8 9.6 -4.4 10.6 -4.2C13.5 -4.2 15.6 -2 15.6 0.6C15.6 3.2 13.5 5.4 10.6 5.4C8.5 5.4 6.5 5.4 5 5.5C3 6.8 1 7.2 0 7.2C-2 7.2-3.5 6.9-4.5 6.6C-9 8.8-13 9.2-17.5 9.2C-27 9.2-35 6.5-35 2Z"/>

    <!-- Umriss mit Flügeln, Beinen und Gliederung, ohne Flächen: für den gestrichelten Königinnenumriss -->
    <g id="m09-zm-gestrichelt">
      <use href="#m09-zm-umriss"/>
      <ellipse cx="-9.3" cy="-9.9" rx="10.5" ry="4.6" transform="rotate(28 -9.3 -9.9)"/>
      <ellipse cx="-5.5" cy="-12.8" rx="9.5" ry="4.2" transform="rotate(55 -5.5 -12.8)"/>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5M7.5 -4.4C6.4 -1 6.4 2 7.4 5.2M-7.5 -3.6C-9.2 0-8.6 4-4.5 6.6"/>
    </g>

    <!-- kleiner Bienenkörper in den Wabengassen -->
    <ellipse id="m09-zm-b" rx="4.3" ry="2.7" fill="#f2c14e" stroke="#3a2a10" stroke-width=".9"/>

    <!-- sechs Waben als schmale senkrechte Streifen, Höhe 90, Ursprung links oben -->
    <g id="m09-zm-waben" fill="#d9a441" stroke="#3a2a10" stroke-width="1">
      <rect x="128.6" y="0" width="10" height="90" rx="1.5"/>
      <rect x="149.1" y="0" width="10" height="90" rx="1.5"/>
      <rect x="169.7" y="0" width="10" height="90" rx="1.5"/>
      <rect x="190.3" y="0" width="10" height="90" rx="1.5"/>
      <rect x="210.9" y="0" width="10" height="90" rx="1.5"/>
      <rect x="231.4" y="0" width="10" height="90" rx="1.5"/>
    </g>
  </defs>

