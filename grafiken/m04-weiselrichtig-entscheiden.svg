<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="m04-we-titel m04-we-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>
  <title id="m04-we-titel">Entscheidungsbaum: Von den Eiern zur Deutung</title>
  <desc id="m04-we-beschr">Entscheidungsbaum: Liegt je ein Ei am Zellgrund, und ist die Arbeiterinnenbrut flach verdeckelt? Ja: weiselrichtig, Königin nicht suchen. Nein: Gibt es Zellen? Nachschaffungszellen und Brausen bedeuten weisellos. Offene Schwarmzellen bedeuten, dass der Schwarm bevorsteht. Verdeckelte Schwarmzellen mit wenig Bienen und Ruhe bedeuten, dass der Schwarm ausgezogen ist. Keine Zellen und kein Brausen deuten auf eine unbegattete Jungkönigin.</desc>

  <defs>
    <!-- BIENENFORM: Königin als Zierde, Seitenansicht, Blick nach rechts, Ursprung in der Mitte der Brust (wie in m01-schwarmzelle.svg) -->
    <g id="we-koenigin">
      <g fill="#ffffff" fill-opacity="0.7" stroke="#3a2a10" stroke-width="1.1">
        <ellipse cx="-9.3" cy="-9.9" rx="10.5" ry="4.6" transform="rotate(28 -9.3 -9.9)"/>
        <ellipse cx="-5.5" cy="-12.8" rx="9.5" ry="4.2" transform="rotate(55 -5.5 -12.8)"/>
      </g>
      <path d="M-3 6.5L-6 12.5M1 7.2L1.5 13.5M4.5 6.5L8.5 11.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <g stroke="#3a2a10" stroke-width="1.5">
        <ellipse cx="-17.5" cy="2" rx="17.5" ry="7.2" fill="#f2c14e"/>
        <path d="M-15 -5.13A17.5 7.2 0 0 1 -12 -4.84L-12 8.84A17.5 7.2 0 0 1 -15 9.13ZM-21.5 -5.01A17.5 7.2 0 0 1 -18.5 -5.19L-18.5 9.19A17.5 7.2 0 0 1 -21.5 9.01ZM-28 -3.76A17.5 7.2 0 0 1 -25 -4.51L-25 8.51A17.5 7.2 0 0 1 -28 7.76Z" fill="#3a2a10" stroke="none"/>
        <ellipse cx="0" cy="0" rx="7.8" ry="7.2" fill="#d9a441"/>
      </g>
      <path d="M13 -3L18.5 -9M14.5 -1.5L21 -5.5" fill="none" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="10.6" cy="0.6" rx="5" ry="4.8" fill="#3a2a10"/>
      <circle cx="12.2" cy="-0.8" r="1.3" fill="#ffffff"/>
      <!-- kleine Krone -->
      <path d="M-3 -10L-3 -20L2 -15L7 -22L12 -15L17 -20L17 -10Z" fill="#f2c14e" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Verbindungen: Frage 1 teilt sich in ja (links) und nein (rechts) -->
  <g fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round">
    <path d="M200 66V84M109 84H303M109 84V95M303 84V95"/>
    <!-- von Frage 2 an die senkrechte Linie links, von dort zu den vier Deutungen -->
    <path d="M303 160V180H18V440"/>
    <path d="M18 218H25M18 282H25M18 356H25M18 440H25"/>
  </g>
  <g fill="#3a2a10">
    <path d="M103.5 94H114.5L109 104Z"/>
    <path d="M297.5 94H308.5L303 104Z"/>
    <path d="M24 212.5V223.5L34 218Z"/>
    <path d="M24 276.5V287.5L34 282Z"/>
    <path d="M24 350.5V361.5L34 356Z"/>
    <path d="M24 434.5V445.5L34 440Z"/>
  </g>

  <!-- Frage 1 -->
  <rect x="40" y="10" width="320" height="56" rx="8" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- ja: Ergebnis links; nein: Frage 2 rechts -->
  <rect x="10" y="104" width="198" height="56" rx="8" fill="#5b8c3a" fill-opacity=".22" stroke="#3a2a10" stroke-width="1.5"/>
  <rect x="216" y="104" width="174" height="56" rx="8" fill="#fff4d6" stroke="#3a2a10" stroke-width="1.5"/>

  <!-- Häkchen als Zierde -->
  <circle cx="188" cy="122" r="11" fill="#5b8c3a"/>
  <path d="M182.5 122.5L186.5 126.5L193.5 117.5" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- vier Deutungen untereinander -->
  <g fill="#ffffff" stroke="#3a2a10" stroke-width="1.5">
    <rect x="34" y="192" width="356" height="52" rx="8"/>
    <rect x="34" y="256" width="356" height="52" rx="8"/>
    <rect x="34" y="320" width="356" height="72" rx="8"/>
    <rect x="34" y="404" width="356" height="72" rx="8"/>
  </g>

  <!-- Königinnensymbole als Zierde: weisellos durchgestrichen -->
  <use href="#we-koenigin" transform="translate(61 220) scale(0.6)"/>
  <line x1="44" y1="203" x2="76" y2="235" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <use href="#we-koenigin" transform="translate(61 442) scale(0.6)"/>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <g font-weight="700" text-anchor="middle">
      <text x="200" y="33">Je ein Ei am Zellgrund</text>
      <text x="200" y="54">und flache Arbeiterinnenbrut?</text>
      <text x="303" y="127">Zellen und</text>
      <text x="303" y="148">Verhalten?</text>
    </g>
    <text x="154" y="77" text-anchor="middle">ja</text>
    <text x="252" y="77" text-anchor="middle">nein</text>
    <text x="22" y="127" font-weight="700">Weiselrichtig,</text>
    <text x="22" y="148">Königin nicht suchen</text>

    <text x="78" y="214">Nachschaffungszellen, Volk braust:</text>
    <text x="78" y="235" font-weight="700">weisellos</text>

    <text x="78" y="278">Offene Schwarmzellen:</text>
    <text x="78" y="299" font-weight="700">Schwarm steht bevor</text>

    <text x="78" y="342">Verdeckelte Schwarmzellen,</text>
    <text x="78" y="363">wenig Bienen, ruhig:</text>
    <text x="78" y="384" font-weight="700">Schwarm ist ausgezogen</text>

    <text x="78" y="426">Keine Zellen, kein Brausen:</text>
    <text x="78" y="447" font-weight="700">vermutlich unbegattete</text>
    <text x="78" y="468" font-weight="700">Jungkönigin</text>
  </g>
</svg>
