<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="m05-kp-titel m05-kp-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="440" fill="#ffffff"/>
  <title id="m05-kp-titel">Die Futterkranzprobe in vier Schritten</title>
  <desc id="m05-kp-beschr">Vier Schritte der Futterkranzprobe untereinander: Brutwabe entnehmen, Futter nahe der Brut mit dem Löffel nehmen, mindestens 50 g in einen beschrifteten, verknoteten Beutel füllen und in einen zweiten Beutel stecken, quetschsicher mit Untersuchungsantrag an den TGD senden.</desc>

  <defs>
    <!-- Feine Sechseckstruktur der Wabe (wie in m01-wabe-aufbau.svg, verkleinert) -->
    <pattern id="m05-kp-sechseck" width="9.093" height="15.75" patternUnits="userSpaceOnUse">
      <path d="M0 2.625L4.547 0L9.093 2.625V7.875L4.547 10.5L0 7.875ZM4.547 10.5V15.75" fill="none" stroke="#3a2a10" stroke-width=".8" stroke-opacity=".35"/>
    </pattern>
    <!-- Wachsdeckel der verdeckelten Brut: ein Kreis je Zelle, auf den Sechseckmittelpunkten -->
    <pattern id="m05-kp-deckel" width="9.093" height="15.75" patternUnits="userSpaceOnUse">
      <g fill="#d9a441" stroke="#3a2a10" stroke-opacity=".5" stroke-width=".6">
        <circle cx="4.547" cy="5.25" r="3.2"/>
        <circle cx="0" cy="13.125" r="3.2"/>
        <circle cx="9.093" cy="13.125" r="3.2"/>
      </g>
    </pattern>
  </defs>

  <!-- Schritt 1: Brutwabe entnehmen, schräg gestellt, ein Ohr des Oberträgers ruht auf den Nachbarrähmchen -->
  <circle cx="30" cy="54" r="16" fill="#b45309"/>
  <text x="30" y="61" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">1</text>
  <g fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round">
    <rect x="53" y="40" width="9" height="12"/>
    <rect x="62" y="39" width="9" height="13"/>
  </g>
  <g transform="translate(116 56) rotate(-12)">
    <rect x="-46" y="-30" width="92" height="7" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-40" y="-23" width="80" height="50" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-35" y="-18" width="70" height="40" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
    <ellipse cx="0" cy="2" rx="26" ry="15" fill="#d9a441" fill-opacity=".4"/>
    <ellipse cx="0" cy="2" rx="26" ry="15" fill="url(#m05-kp-deckel)"/>
    <rect x="-35" y="-18" width="70" height="40" fill="url(#m05-kp-sechseck)"/>
  </g>

  <!-- Schritt 2: Futter nahe der Brut mit dem Löffel nehmen -->
  <circle cx="30" cy="162" r="16" fill="#b45309"/>
  <text x="30" y="169" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2</text>
  <rect x="62" y="122" width="104" height="80" fill="#f2c14e"/>
  <ellipse cx="108" cy="162" rx="32" ry="26" fill="#fff4d6"/>
  <ellipse cx="108" cy="162" rx="32" ry="26" fill="url(#m05-kp-deckel)"/>
  <rect x="62" y="122" width="104" height="80" fill="url(#m05-kp-sechseck)"/>
  <ellipse cx="108" cy="162" rx="32" ry="26" fill="none" stroke="#3a2a10" stroke-width="1"/>
  <rect x="62" y="122" width="104" height="80" fill="none" stroke="#3a2a10" stroke-width="1.5"/>
  <!-- Löffel an den Futterzellen, nicht in der Brut -->
  <g transform="translate(146 186) rotate(25)" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round">
    <rect x="8" y="-2.5" width="28" height="5" rx="2.5" fill="#b8bcc2"/>
    <ellipse cx="0" cy="0" rx="10" ry="6.5" fill="#b8bcc2"/>
    <ellipse cx="-1.5" cy="0" rx="5.5" ry="3" fill="#f2c14e" stroke-width="1"/>
  </g>

  <!-- Schritt 3: mindestens 50 g im verknoteten Gefrierbeutel -->
  <circle cx="30" cy="270" r="16" fill="#b45309"/>
  <text x="30" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text>
  <!-- zweiter Beutel um den ersten, ebenfalls verknotet -->
  <path d="M104 220Q78 230 72 262Q66 296 74 312Q78 322 90 322H140Q152 322 156 312Q164 296 158 262Q152 230 126 220Z" fill="#4a7fb5" fill-opacity=".08" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M109 215L100 208M121 215L130 208" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="115" cy="216" rx="8" ry="5" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M108 243Q92 249 86 267Q80 289 84 304Q86 312 94 312H136Q144 312 146 304Q150 289 144 267Q138 249 122 243Z" fill="#4a7fb5" fill-opacity=".12" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M95 311Q99 293 115 291Q131 293 135 311Z" fill="#f2c14e" stroke="#3a2a10" stroke-width="1" stroke-linejoin="round"/>
  <g fill="#d9a441">
    <circle cx="106" cy="302" r="1.8"/>
    <circle cx="116" cy="299" r="1.8"/>
    <circle cx="125" cy="304" r="1.8"/>
  </g>
  <path d="M109 238L100 231M121 238L130 231" fill="none" stroke="#3a2a10" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="115" cy="239" rx="8" ry="6" fill="#fffaf0" stroke="#3a2a10" stroke-width="1.5"/>
  <text x="115" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1a12">50 g</text>

  <!-- Schritt 4: Versandkarton mit Untersuchungsantrag -->
  <circle cx="30" cy="378" r="16" fill="#b45309"/>
  <text x="30" y="385" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">4</text>
  <path d="M70 380L82 368H170L158 380Z" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M70 380L82 368H170L158 380Z" fill="#3a2a10" fill-opacity=".35"/>
  <rect x="96" y="334" width="54" height="56" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5"/>
  <path d="M104 366H142M104 374H142" fill="none" stroke="#3a2a10" stroke-width="1" stroke-opacity=".5"/>
  <text x="123" y="356" text-anchor="middle" font-size="14" fill="#1f1a12">Antrag</text>
  <rect x="70" y="380" width="88" height="40" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M158 380L170 368V408L158 420Z" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M158 380L170 368V408L158 420Z" fill="#3a2a10" fill-opacity=".18"/>

  <!-- Pfeile zwischen den Schritten -->
  <g fill="#3a2a10" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round">
    <line x1="30" y1="92" x2="30" y2="112" stroke-width="2.5"/>
    <path d="M30 124L23 112H37Z"/>
    <line x1="30" y1="200" x2="30" y2="220" stroke-width="2.5"/>
    <path d="M30 232L23 220H37Z"/>
    <line x1="30" y1="308" x2="30" y2="328" stroke-width="2.5"/>
    <path d="M30 340L23 328H37Z"/>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1f1a12" font-size="16">
    <text x="184" y="60">Brutwabe entnehmen</text>
    <text x="184" y="168">Futter nahe der Brut</text>
    <text x="184" y="254"><tspan x="184">mindestens 50 g,</tspan><tspan x="184" dy="20">beschriften, verknoten,</tspan><tspan x="184" dy="20">zweiter Beutel</tspan></text>
    <text x="184" y="372"><tspan x="184">quetschsicher an </tspan><tspan x="184" dy="20">den TGD, mit Antrag</tspan></text>
  </g>
</svg>
