<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="m06-sf-titel m06-sf-beschr" xml:lang="de" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>
  <title id="m06-sf-titel">Eine Schwarmtraube fangen</title>
  <desc id="m06-sf-beschr">Vier Schritte zum Einfangen einer Schwarmtraube. Schritt 1: Eine Schere kürzt Äste neben der Traube. Schritt 2: Ein Wasserzerstäuber besprüht die Traube. Schritt 3: Die Fangkiste mit geschlossenem Boden hält unter der Traube, ein Pfeil zeigt den kurzen Ruck nach unten. Schritt 4: Auf die Fangkiste ist eine Zarge mit Mittelwänden gesetzt, das Flugloch ist offen.</desc>

  <defs>
    <!-- Bienenpunkte der Traube: dunkler Grund, kleine Bienenkörper darüber -->
    <pattern id="m06-sf-bienen" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#d9a441" stroke="#3a2a10" stroke-width=".6"/>
    </pattern>
    <!-- Traube: länglich, oben breit am Ast, unten spitz; Ursprung oben in der Mitte -->
    <g id="m06-sf-traube">
      <path d="M-17 0C-17 22-12 44 0 58C12 44 17 22 17 0Z" fill="#3a2a10"/>
      <path d="M-17 0C-17 22-12 44 0 58C12 44 17 22 17 0Z" fill="url(#m06-sf-bienen)" stroke="#3a2a10" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <!-- waagrechter Ast, Ursprung links oben -->
    <rect id="m06-sf-ast" x="56" y="26" width="140" height="8" rx="4" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
    <!-- Pfeilspitze nach unten -->
    <path id="m06-sf-pfeil" d="M154 60H174L164 76Z" fill="#b45309"/>
  </defs>

  <!-- Trennlinien zwischen den Schritten -->
  <path d="M10 128H390M10 246H390M10 364H390" fill="none" stroke="#3a2a10" stroke-opacity=".25" stroke-width="1"/>

  <!-- ===== Schritt 1: Äste kürzen ===== -->
  <g transform="translate(0 16)">
    <circle cx="28" cy="58" r="14" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5"/>
    <text x="28" y="63.500" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1a12">1</text>

    <use href="#m06-sf-ast"/>
    <!-- Seitenzweig mit Blättern -->
    <path d="M158 28L194 3" fill="none" stroke="#3a2a10" stroke-width="5" stroke-linecap="round"/>
    <path d="M158 28L194 3" fill="none" stroke="#e8c99a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="188" cy="12" rx="7" ry="3.500" transform="rotate(35 188 12)" fill="#5b8c3a" stroke="#3a2a10" stroke-width="1"/>
    <ellipse cx="196" cy="6" rx="6" ry="3" transform="rotate(-20 196 6)" fill="#5b8c3a" stroke="#3a2a10" stroke-width="1"/>
    <!-- Traube -->
    <use href="#m06-sf-traube" x="84" y="34"/>
    <!-- Schere: zwei Klingen um den Zweig, Griffe links -->
    <path d="M150 12L180 10L150 17Z" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M150 14L174 28L150 19Z" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M150 13L146 10M150 18L146 21" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="140" cy="8" rx="6" ry="4.500" transform="rotate(-10 140 8)" fill="none" stroke="#b45309" stroke-width="2"/>
    <ellipse cx="140" cy="23" rx="6" ry="4.500" transform="rotate(10 140 23)" fill="none" stroke="#b45309" stroke-width="2"/>
    <!-- Linie zur Traube -->
    <line x1="92" y1="81" x2="106" y2="81" stroke="#3a2a10" stroke-width="1"/>
    <circle cx="92" cy="81" r="2.300" fill="#3a2a10"/>
    <g fill="#1f1a12" font-size="16">
      <text x="110" y="86.500">Traube</text>
      <text x="200" y="60">Äste kürzen</text>
    </g>
  </g>

  <!-- ===== Schritt 2: Traube besprühen ===== -->
  <g transform="translate(0 134)">
    <circle cx="28" cy="58" r="14" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5"/>
    <text x="28" y="63.500" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1a12">2</text>

    <use href="#m06-sf-ast"/>
    <use href="#m06-sf-traube" x="84" y="34"/>
    <!-- Wasserzerstäuber: Flasche mit Pumpkopf, Düse zeigt zur Traube -->
    <rect x="148" y="58" width="28" height="44" rx="5" fill="#4a7fb5" fill-opacity=".25" stroke="#3a2a10" stroke-width="1.5"/>
    <rect x="151" y="78" width="22" height="21" rx="3" fill="#4a7fb5" fill-opacity=".6"/>
    <rect x="155" y="50" width="14" height="8" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5"/>
    <rect x="146" y="42" width="32" height="8" rx="2" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.5"/>
    <rect x="133" y="44" width="14" height="4" fill="#b8bcc2" stroke="#3a2a10" stroke-width="1.2"/>
    <!-- Sprühpunkte -->
    <g fill="#4a7fb5" stroke="#3a2a10" stroke-width=".5">
      <circle cx="126" cy="47" r="1.800"/>
      <circle cx="119" cy="51" r="1.800"/>
      <circle cx="123" cy="57" r="1.800"/>
      <circle cx="112" cy="55" r="1.800"/>
      <circle cx="116" cy="62" r="1.800"/>
      <circle cx="107" cy="60" r="1.800"/>
      <circle cx="109" cy="68" r="1.800"/>
    </g>
    <text x="200" y="60" font-size="16" fill="#1f1a12">Traube besprühen</text>
  </g>

  <!-- ===== Schritt 3: Fangkiste mit geschlossenem Boden darunter, kurzer Ruck ===== -->
  <g transform="translate(0 252)">
    <circle cx="28" cy="58" r="14" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5"/>
    <text x="28" y="63.500" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1a12">3</text>

    <use href="#m06-sf-ast"/>
    <!-- Fangkiste als nach oben offenes Rechteck auf durchgehendem Boden -->
    <rect x="58" y="66" width="76" height="42" fill="#fff4d6"/>
    <rect x="52" y="66" width="6" height="42" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
    <rect x="134" y="66" width="6" height="42" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
    <rect x="46" y="108" width="100" height="8" fill="#e8c99a" stroke="#3a2a10" stroke-width="2.500"/>
    <!-- Traube fällt zum Teil in die Zarge -->
    <use href="#m06-sf-traube" x="96" y="34"/>
    <g fill="#d9a441" stroke="#3a2a10" stroke-width=".7">
      <circle cx="84" cy="98" r="2.300"/>
      <circle cx="97" cy="102" r="2.300"/>
      <circle cx="109" cy="97" r="2.300"/>
    </g>
    <!-- kurzer, dicker Pfeil nach unten am Ast -->
    <line x1="164" y1="38" x2="164" y2="62" stroke="#b45309" stroke-width="6"/>
    <use href="#m06-sf-pfeil"/>
    <g fill="#1f1a12" font-size="16">
      <text x="200" y="48">Fangkiste mit</text>
      <text x="200" y="70">geschlossenem Boden</text>
      <text x="200" y="92">darunter, kurzer Ruck</text>
    </g>
  </g>

  <!-- ===== Schritt 4: Zarge mit Mittelwänden aufsetzen, Flugloch offen ===== -->
  <g transform="translate(0 370)">
    <circle cx="28" cy="58" r="14" fill="#ffffff" stroke="#3a2a10" stroke-width="1.5"/>
    <text x="28" y="63.500" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1a12">4</text>

    <rect x="46" y="108" width="100" height="8" fill="#e8c99a" stroke="#3a2a10" stroke-width="2.500"/>
    <!-- untere Zarge mit dem Schwarm, Flugloch am Fuß rechts -->
    <rect x="52" y="70" width="88" height="38" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
    <rect x="58" y="75" width="76" height="28" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
    <ellipse cx="96" cy="92" rx="22" ry="8" fill="#3a2a10"/>
    <ellipse cx="96" cy="92" rx="22" ry="8" fill="url(#m06-sf-bienen)" stroke="#3a2a10" stroke-width="1.2"/>
    <rect x="134" y="94" width="6" height="10" fill="#3a2a10"/>
    <!-- obere Zarge mit Mittelwänden -->
    <rect x="52" y="32" width="88" height="38" fill="#e8c99a" stroke="#3a2a10" stroke-width="1.5"/>
    <rect x="58" y="37" width="76" height="28" fill="#fff4d6" stroke="#3a2a10" stroke-width="1"/>
    <path d="M66 37V65M78 37V65M90 37V65M102 37V65M114 37V65M126 37V65" fill="none" stroke="#3a2a10" stroke-opacity=".7" stroke-width="1.200"/>
    <!-- Linie zum Flugloch -->
    <line x1="140" y1="99" x2="150" y2="106" stroke="#3a2a10" stroke-width="1"/>
    <circle cx="140" cy="99" r="2.300" fill="#3a2a10"/>
    <g fill="#1f1a12" font-size="16">
      <text x="200" y="50">Zarge mit Mittelwänden</text>
      <text x="200" y="72">aufsetzen</text>
      <text x="154" y="112">Flugloch offen</text>
    </g>
  </g>
</svg>
